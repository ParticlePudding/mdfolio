# Creates a release (SPEC 8.8 AU-2, AU-3). It runs in either of these cases:
#   - When a tag starting with v (e.g. v1.2.0) is pushed
#   - When "Run workflow" is pressed on the GitHub Actions page (creates a tag for the package.json version from the latest main)
# Create a GitHub release when a tag such as v1.2.0 is pushed, or when started by hand from the Actions tab
# (then the tag v<package.json version> is created on the latest main).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then echo "Run this workflow from main"; exit 1; fi
            if gh release view "v$v" >/dev/null 2>&1; then echo "Release v$v already exists"; exit 1; fi
            exit 0
          fi
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package.json version $v"
            exit 1
          fi
      - name: Build
        run: node tools/build.mjs
      - name: Unit tests
        run: npm run test:unit
      - name: Make release files
        run: node tools/dev/make-release.mjs
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # The tag is created here (on the current commit of main)
            gh release create "v$v" tmp/release/mdfolio.html "tmp/release/mdfolio-$v.zip" \
              --title "mdfolio $v" --notes-file tmp/release/notes.md --target "$GITHUB_SHA"
          else
            gh release create "$GITHUB_REF_NAME" tmp/release/mdfolio.html "tmp/release/mdfolio-$v.zip" \
              --title "mdfolio $v" --notes-file tmp/release/notes.md --verify-tag
          fi
