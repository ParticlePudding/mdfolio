ross/smoke |  |\n| FR-503 | 画面幅による切り替え | e2e/settings, cross/smoke |  |\n| FR-504 | 印刷 | e2e/settings | 印刷用の表示に切り替えて確認。紙への出力は未確認 |\n| FR-601 | サイトの書き出し | e2e/export, e2e/embed | 保存を使わない設定ではメニューに出ないことを含む |\n| FR-602 | 添付の埋め込み | e2e/export, unit/md |  |\n| FR-603 | 未使用ライブラリの除外 | e2e/export, unit/md |  |\n| FR-604 | コマンドライン版 | e2e/export, unit/cli | アプリ内の書き出しと内容が一致することも確認。追加したオプションは、設定のブロックだけが変わることを確認 |\n| FR-701 | 設定ブロック | e2e/settings, e2e/startup, e2e/embed, unit/core |  |\n| FR-702 | 設定の保存 | e2e/settings, e2e/startup, cross/smoke |  |\n| FR-801 | ヘルプ | e2e/startup, e2e/embed | お試し用の公開ページでの注意書き（日本語・英語）を含む |\n| FR-802 | ライセンス表示 | e2e/export, e2e/startup, unit/build |  |\n| FR-901 | エラーの通知 | e2e/open, e2e/startup |  |\n| FR-902 | 文書がない場合 | e2e/open |  |\n| SEC-1 | サニタイズ | e2e/security, cross/smoke |  |\n| SEC-2 | ID の接頭辞・内部クラスの除去 | e2e/security |  |\n| SEC-3 | style の制限 | e2e/render, e2e/security, unit/build, unit/core |  |\n| SEC-4 | CSP（スクリプトはハッシュのみ） | e2e/security, e2e/startup, cross/smoke |  |\n| SEC-5 | 通信しない | e2e/security, e2e/settings, e2e/startup, cross/smoke | サーバー側の記録で判定 |\n| SEC-6 | 数式・図の安全な設定 | e2e/security |  |\n| SEC-7 | 外部リンクの rel | e2e/navigate |  |\n| SEC-8 | 送信機能を持たない | e2e/security, unit/build | 通信の機能を使っていないことをソースでも確認（unit/build） |\n| SEC-9 | 添付は常にダウンロード | e2e/navigate, e2e/security |  |\n| SEC-10 | 外部画像を CSP でも遮断 | e2e/security, e2e/settings, cross/smoke |  |\n| NFR-1 | 単一ファイル | e2e/startup, unit/build |  |\n| NFR-2 | 性能 | e2e/perf | 計測値は 4 章 |\n| NFR-3 | サイズ | unit/build |  |\n| NFR-4 | アクセシビリティ | e2e/a11y, e2e/navigate | 5 章 |\n| NFR-5 | 国際化 | unit/build, e2e/settings, e2e/open |  |\n| NFR-6 | 保守性 | unit/build |  |\n| NFR-7 | 堅牢性 | e2e/startup, e2e/settings |  |\n\n要件 ID のない記述の確認:\n\n| 仕様の箇所 | 確認したテスト | 補足 |\n|---|---|---|\n| 2.1 別のページの中に埋め込んで表示する場合 | e2e/embed, cross/smoke | 別オリジンのサンドボックス化したフレーム、`srcdoc` のフレーム（保存領域が使えない場合を含む）、nonce 方式の CSP。条件を模したもので、実際のサービスの中では確認していない |\n| 6.1 外部のホスティング環境に置く場合（お試し用の変換） | unit/package, e2e/embed, cross/smoke | 変換で変わるのが CSP の行と設定のブロックだけであること、変換後の HTML が上のフレームで動くこと |\n| 8.3 zip の作成 | unit/package | 日本語のファイル名に UTF-8 の印が付くこと。Windows での展開は確認していない |\n\n---\n\n## 8. 自動テストで確認できていないこと\n\n| 項目 | 理由 | 影響の見込み |\n|---|---|---|\n| 製品版の Firefox / Safari | テスト環境に導入できない | 同じエンジンで主要機能は確認済み。細かな表示の差が残る可能性はある |\n| Windows / macOS の実機 | テスト環境が Linux のみ | ブラウザーのエンジンは共通。フォント、スクロールバー、ファイルのパス（ドライブ文字）まわりは未確認 |\n| ブラウザー本来のフォルダ選択画面（`showDirectoryPicker`）を通した操作 | 自動操作できない | 選択後の処理は、差し替えたハンドルと本物のハンドル（OPFS）で確認済み |\n| `file://` で開いた状態での「前回のフォルダを開く」 | 同上（OPFS は `file://` で使えないため、`http://` で確認した） | 失敗しても、ボタンが出ないだけで閲覧には影響しない設計 |\n| Firefox / Safari でのフォルダ選択（`\u003cinput webkitdirectory>`）とドラッグ＆ドロップ | WebDriver では操作できない | ファイルを選ぶ操作は両エンジンで確認済み。Chromium では実フォルダで確認済み |\n| 紙への印刷、PDF への出力 | 印刷用の表示までしか確認していない | — |\n| 読み上げソフトでの操作 | 自動化できない | 機械的に判定できる項目は確認済み |\n| スマートフォン・タブレットの実機（iOS / Android） | テスト環境にない | 幅 390px・タッチ操作を模した Chromium で、レイアウト、ドロワー、ファイルを開く操作を確認した。実機のファイル選択画面、Safari（iOS）での表示、アプリ内ブラウザーでの動作は未確認 |\n| 実際のホスティング環境（Claude のアーティファクト）の中での動作 | 公開先の画面は、テスト用のブラウザーでは開けない。利用者のパソコンのブラウザー（Claude アプリの中のもの）で開くことも試みたが、公開先にサインインしておらず、ページを表示できなかった | サンプルのページ 2 つを公開する操作は成功した（公開先がファイルを受け付けた。T-24）。表示と操作は、公開されている説明（サンドボックス化したフレーム、画像は `data:` / `blob:` のみ、保存・ダイアログは不可、スクリプトの差し込み）を模したフレームで確認しただけである。T-24 のように、説明から読み取れない条件がほかにもある可能性があり、表示や操作に差が出るかもしれない |\n| Windows で展開した zip のファイル名 | テスト環境が Linux のみ | zip の各項目に UTF-8 の印があることは機械的に確認済み（T-19） |\n| 5,000 文書・100MB 級の実データ | 上限の動作（打ち切りと通知）は確認したが、長時間の利用は未確認 | — |\n\n### 手動確認の一覧\n\n配布の前に、実際に使う環境で次を確認することをお勧めします（各 1〜2 分）。\n\n1. **Windows の Edge または Chrome**: `mdfolio.html` をダブルクリックで開く → 「フォルダを開く」で `sample-docs` を選ぶ → 文書が表示され、左の一覧・検索・目次が使える。\n2. 同じ画面で、サイドバーや目次に余分なスクロールバーが出ていない。日本語のフォントが読みやすい。\n3. ブラウザーを閉じて開き直す → 「前回のフォルダを開く（sample-docs）」が出て、押すと開ける。\n4. エディターで `sample-docs/README.md` を書き換えて保存する → 2〜3 秒で表示が変わる。\n5. メニューの「サイトとして書き出す」→ 保存した HTML を別のパソコン（または別のブラウザー）で開く → そのまま読める。\n6. **Firefox**: `mdfolio.html` を開く → 「フォルダを開く」でフォルダを選ぶ（アップロードの確認が出たら許可する。送信はされない）→ 文書が表示される。フォルダをウィンドウにドロップしても開ける。\n7. **Safari（Mac）**: 6 と同じ。書き出したサイトの HTML も開いて、数式と図が表示されることを確認する。\n8. 印刷のプレビューで、本文だけが白地で出る。\n9. 開発者ツールのネットワークの欄を開いた状態で文書をいくつか表示し、通信が発生していないことを確認する。\n10. **zip の展開（Windows）**: 配布の zip を展開する → `sample-docs/guide/` のファイル名が日本語で読める → `mdfolio.html` で `sample-docs` を開き、「基本操作」などのリンクで移動できる。\n11. **スマートフォン**: 書き出したサイトの HTML（または公開したページ）を開く → 左上の ≡ で文書の一覧が出る → 表・コードが横にはみ出さず、その中で横にスクロールできる → 数式と図が表示される。\n12. **スマートフォン**: ビューアで「ファイルを開く」を押す → `.md` のファイルを選べる → 表示される。\n13. **公開したページ（お試し用に変換した HTML）**: リンクでの移動、検索、テーマの切り替え、コードのコピーができる。メニューに「サイトとして書き出す」「外部の画像を表示する」が出ていない。添付へのリンクを押すと、保存できない旨の説明が出る。\n\n---\n\n## 9. テストの再実行\n\n```\nnpm install                       # Playwright、axe-core など（成果物には含まれない）\nnpx playwright install chromium\nnpm test                          # ビルド → 単体テスト → ブラウザーでのテスト\nnode tools/dev/test-summary.mjs   # ファイルごとの件数と所要時間を test-results/ に出力\nnpm run test:webkit               # WebKitGTK（要 webkit2gtk-driver、xvfb）\nnpm run test:gecko                # Firefox 系（要 geckodriver。MDFOLIO_GECKO_BINARY で実行ファイルを指定）\n```\n\n性能テストは機械の速さに左右されます。目標値は 2 コアの機械を想定したものなので、それより遅い環境や、ほかの処理が動いている間は失敗することがあります（4 章）。zip の作成のテスト（`tests/unit/package.test.mjs` の一部）は Python 3 を使います。ない環境では、その 2 件だけスキップします。\n"}]}</script>
<script type="application/json" id="mdv-res-help-ja">"# mdfolio の使い方\n\nmdfolio は、Markdown 文書をブラウザだけで読むためのビューアです。サーバーもインストールも要りません。文書はこの端末の中だけで処理され、外部には送信されません。\n\n## 文書を開く\n\n| やりたいこと | 操作 |\n|---|---|\n| フォルダごと開く | 「フォルダを開く」を押してフォルダを選ぶ。または、フォルダをこの画面にドロップする |\n| ファイルだけ開く | 「ファイルを開く」を押す。または、`.md` ファイルをドロップする |\n| 前回のフォルダを開く | 開始画面の「前回のフォルダを開く」を押す（Edge / Chrome のみ） |\n\nフォルダを開くと、左にファイルの一覧、右にページ内の目次が表示されます。\n\n> [!NOTE]\n> フォルダを選ぶとき、ブラウザが「ファイルの表示を許可しますか」や「アップロードしますか」と確認することがあります。これはブラウザがこのページにフォルダの読み取りを許可するための確認です。ファイルが外部に送信されることはありません。\n\nファイルだけを開いた場合、同じフォルダにある画像は表示できません。画像も表示したいときは、フォルダごと開いてください。\n\n## 読む\n\n- **文書の切り替え**: 左の一覧、または本文中のリンクで移動します。ブラウザの「戻る」「進む」も使えます。\n- **検索**: 上部の検索欄に語を入れます。`Ctrl+K`（Mac は `⌘K`）または `/` で検索欄に移動します。空白で区切ると、すべての語を含む文書に絞り込みます。大文字と小文字、全角と半角は区別しません。\n- **テーマ**: 右上のボタンを押すたびに「自動 → ライト → ダーク」と切り替わります。\n- **印刷・PDF 保存**: ブラウザの印刷機能を使います。本文だけが出力されます。\n- **更新の反映**: Edge / Chrome でフォルダを開いている場合、表示中のファイルを編集して保存すると、表示が自動で更新されます。ファイルの追加や削除は、メニューの「再読み込み」で反映します。\n\n## 配布する\n\nメニューの「サイトとして書き出す」を使うと、開いている文書一式を 1 つの HTML ファイルにまとめられます。受け取った人は、その HTML ファイルを開くだけで読めます。\n\n- 文書から参照されている画像や添付ファイルも一緒に入ります（1 件 20MB まで）。\n- 数式や図を使っていない場合は、そのためのプログラムを省いてファイルを小さくします。\n- メールやチャットで HTML を直接送ると、途中で内容が書き換えられて動かなくなることがあります。zip にまとめて送ると確実です。\n\n## 見た目を変える\n\nこの HTML と同じフォルダに `mdfolio.css` を置くと、その CSS で見た目が変わります（開き直すと反映されます）。配色の変数（`--accent` など）を変えると、本文・画面・図の色がそろって変わります。\n\n書き出したサイトに入れるには、「サイトとして書き出す」の画面で「CSS を選ぶ」から同じファイルを選びます。ブラウザーの決まりで、隣のファイルの中身を自動では読み取れないためです。\n\n## サイドバーの並びを決める\n\nフォルダの直下に `_sidebar.md`（または `SUMMARY.md`）を置くと、その内容がサイドバーの「ナビ」に表示されます。リンクのリストを書きます。\n\n```markdown\n- [はじめに](README.md)\n- 使い方\n  - [インストール](guide/install.md)\n  - [設定](guide/config.md)\n```\n\n## 使える記法\n\n見出し、リスト、表、コード、リンク、画像などの一般的な Markdown に加えて、次の記法が使えます。\n\n| 記法 | 書き方 |\n|---|---|\n| タスクリスト | `- [ ] 未完了`、`- [x] 完了` |\n| 脚注 | 本文に `[^1]`、別の行に `[^1]: 脚注の内容` |\n| 補足・警告 | `> [!NOTE]`、`> [!TIP]`、`> [!IMPORTANT]`、`> [!WARNING]`、`> [!CAUTION]` |\n| 数式 | 文中は `$E = mc^2$`、独立した式は `$$` で囲む |\n| 図 | 言語名を `mermaid` にしたコードブロック |\n\nリンクと画像は、文書からの相対パスで書きます（例: `[設定](guide/config.md)`、`![構成図](img/overview.png)`）。\n\n図（Mermaid）は、フローチャート、シーケンス図、クラス図、状態遷移図、ER 図、ガントチャート、円グラフなどが使えます。**マインドマップ（`mindmap`）とアーキテクチャ図（`architecture-beta`）は使えません**（同梱している軽量版に含まれていないため）。書いた場合は、図の代わりにエラーを表示します。\n\n## 外部の画像\n\nインターネット上の画像や動画（`https://…`）は、初期設定では表示しません。読み込むと、配信元のサーバーに「この文書を開いた」ことが伝わるためです。図（Mermaid）の中で指定された画像も同じ扱いで、ブラウザーの機能（コンテンツセキュリティポリシー）でも読み込みを止めています。\n\nメニューの「外部の画像を表示する」で切り替えられます。表示する側に切り替えると、ページが自動で再読み込みされます。フォルダを開いていた場合は、再読み込みのあとで開き直してください。\n\n## キーボードで操作する\n\n| キー | 動作 |\n|---|---|\n| `Ctrl+K`（Mac は `⌘K`）、`/` | 検索欄へ移動 |\n| `↑` `↓` `Enter` | 検索結果を選んで開く |\n| `Tab` | 次の項目へ移動。ページの先頭で押すと「本文へ移動」が出る |\n| メニュー（⋯）で `Enter` または `↓` | メニューを開く。`↑` `↓` で項目を選ぶ |\n| `Esc` | 検索結果・メニュー・ダイアログを閉じる |\n| 横に長い表やコードで `←` `→` | Tab でその表やコードへ移動してから、横にスクロール |\n\n## 困ったとき\n\n| 状況 | 対処 |\n|---|---|\n| 画像が表示されない | ファイルだけを開いている場合は、フォルダごと開く。画像のパスが、文書からの相対パスになっているか確認する |\n| 文字化けする | 文書を UTF-8 で保存し直す（対応: UTF-8、BOM 付き UTF-16、Shift_JIS） |\n| リンク先が「見つかりません」になる | リンクのパスとファイル名を確認する。`C:\\…` のような絶対パスは使えない |\n| 「前回のフォルダを開く」が出ない | Edge / Chrome 以外では使えない。フォルダを選び直す |\n| 数式や図が表示されない | 書き出した HTML で、書き出し時に数式や図を使っていなかった場合は表示できない。元のフォルダから書き出し直す |\n"</script>
<script type="application/json" id="mdv-res-help-en">"# How to use mdfolio\n\nmdfolio is a Markdown document viewer that runs entirely in your browser. It needs no server and no installation. Documents are processed on this device only and are never sent anywhere.\n\n## Open documents\n\n| To do this | Do this |\n|---|---|\n| Open a whole folder | Press \"Open folder\" and choose a folder, or drop a folder onto this window |\n| Open individual files | Press \"Open files\", or drop `.md` files |\n| Reopen the last folder | Press \"Reopen last folder\" on the start screen (Chrome / Edge only) |\n\nAfter you open a folder, the file list appears on the left and the outline of the page on the right.\n\n> [!NOTE]\n> When you choose a folder, the browser may ask whether to let the site view files, or whether to \"upload\" them. This only lets this page read the folder. No file is sent anywhere.\n\nIf you open files only, images in the same folder cannot be shown. Open the whole folder to show them.\n\n## Read\n\n- **Switch documents**: use the list on the left or links in the text. The browser's Back and Forward buttons work too.\n- **Search**: type in the search box at the top. `Ctrl+K` (`⌘K` on Mac) or `/` moves to the search box. All search terms must appear in a matching document. Search is case-insensitive and treats full-width and half-width characters as equivalent.\n- **Theme**: the button at the top right cycles through auto, light and dark.\n- **Print or save as PDF**: use the browser's print function. Only the document body is printed.\n- **Automatic refresh**: when a folder is open in Chrome or Edge, saving the document you are viewing updates the page automatically. Use \"Reload\" in the menu after adding or removing files.\n\n## Distribute\n\n\"Export as site\" in the menu packs the open documents into one HTML file. Recipients only need to open that file to read them.\n\n- Images and attachments referenced by the documents are included (up to 20 MB each).\n- If no document uses math or diagrams, the code for those features is left out to keep the file small.\n- An HTML file sent as-is by email or chat may be altered in transit and stop working. Zip it first to be safe.\n\n## Change the look\n\nPlace `mdfolio.css` in the same folder as this HTML file to change its look with that CSS (reopen the file to apply it). Changing color variables such as `--accent` changes the colors of the text, the interface, and diagrams together.\n\nTo include it in an exported site, choose the same file with \"Choose CSS\" in the \"Export as site\" dialog. The browser does not let the page read the contents of nearby files automatically.\n\n## Control the sidebar order\n\nPlace `_sidebar.md` (or `SUMMARY.md`) at the top level of the folder. Its contents will appear in the \"Nav\" tab of the sidebar. Write a list of links.\n\n```markdown\n- [Introduction](README.md)\n- Guide\n  - [Install](guide/install.md)\n  - [Settings](guide/config.md)\n```\n\n## Supported syntax\n\nBesides common Markdown such as headings, lists, tables, code, links and images, the following are supported.\n\n| Syntax | How to write |\n|---|---|\n| Task lists | `- [ ] todo`, `- [x] done` |\n| Footnotes | `[^1]` in the text and `[^1]: note` on its own line |\n| Alerts | `> [!NOTE]`, `> [!TIP]`, `> [!IMPORTANT]`, `> [!WARNING]`, `> [!CAUTION]` |\n| Math | `$E = mc^2$` inline, `$$` around a display equation |\n| Diagrams | a code block with the language set to `mermaid` |\n\nWrite links and images as paths relative to the document (for example `[Settings](guide/config.md)`, `![Overview](img/overview.png)`).\n\nDiagrams (Mermaid) include flowcharts, sequence diagrams, class diagrams, state diagrams, ER diagrams, Gantt charts, pie charts and more. **Mindmaps (`mindmap`) and architecture diagrams (`architecture-beta`) are not available** (the bundled lightweight build does not include them). If you use either of these diagram types, an error message appears instead of the diagram.\n\n## External images\n\nImages and videos on the internet (`https://…`) are not shown by default, because loading them tells the hosting server that you opened the document. Images referenced inside diagrams (Mermaid) are treated the same way, and the browser's Content Security Policy blocks them as well.\n\nSwitch this with \"Show external images\" in the menu. Turning it on reloads the page; if you had a folder open, open it again after the reload.\n\n## Keyboard\n\n| Key | Action |\n|---|---|\n| `Ctrl+K` (`⌘K` on Mac), `/` | Go to the search box |\n| `↑` `↓` `Enter` | Choose and open a search result |\n| `Tab` | Move to the next item. Pressing Tab for the first time on a page reveals a \"Skip to content\" link |\n| `Enter` or `↓` on the menu (⋯) | Open the menu. Choose an item with `↑` `↓` |\n| `Esc` | Close search results, the menu or a dialog |\n| `←` `→` on a wide table or code block | Scroll sideways (press Tab to move to the table or code block first) |\n\n## Troubleshooting\n\n| Situation | What to do |\n|---|---|\n| Images do not appear | If you opened files only, open the whole folder. Check that image paths are relative to the document |\n| Text is garbled | Save the document as UTF-8 (supported: UTF-8, UTF-16 with BOM, Shift_JIS) |\n| A link says \"not found\" | Check the link path and the file name. Absolute paths such as `C:\\…` do not work |\n| \"Reopen last folder\" is missing | It is available in Chrome / Edge only. Choose the folder again |\n| Math or diagrams do not appear | If none of the documents used math or diagrams when you exported the site, the code for them was left out of the exported file. Export again from the original folder |\n"</script>

  function toggleExternalImages() {
    if (state.config.lockExternalImages) return;
    if (externalAllowed()) {
      // 許可 → 遮断は、その場で反映できる
      state.settings.externalImages = false;
      saveSettings();
      lockExternalMedia();
      refreshView();
      return;
    }
    if (!state.mediaLocked) {
      state.settings.externalImages = true;
      saveSettings();
      refreshView();

    openExternalDialog();

  /** 遮断 → 許可は再読み込みが必要なので、接続先が増えることと合わせて確認する。 */
  function openExternalDialog() {
    const losesFolder = state.mode !== 'site' && !!state.set;
    const d = dialogShell('mdv-dialog-external', 'externalTitle', t('externalLead'));
    if (losesFolder) d.body.appendChild(h('p', { class: 'mdv-dialog-note' }, t('externalLeadFolder')));

      const before = state.settings.externalImages;
      state.settings.externalImages = true;
