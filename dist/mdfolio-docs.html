<script type="application/json" id="mdv-config">{"title":"mdfolio ドキュメント","lang":"ja","theme":"auto","home":"README.md","allowExternalImages":false,"allowDownloads":true,"lockExternalImages":false,"hosted":false}</script>
<script type="application/json" id="mdv-site">{"format":1,"generator":"mdfolio 1.3.0","created":"2026-11-17T13:25:10.033Z","name":"mdfolio-docs-wvVxp6","files":[{"path":"README.md","kind":"doc","mtime":1794921899904,"text":"# mdfolio\n\nブラウザーだけで読める Markdown 文書ビューアです。サーバーもインストールも、Node.js などのツールも要りません。\n\n- バージョン: 1.3.0\n- 公開ページ: https://particlepudding.github.io/mdfolio/\n- 不具合・要望: [Issues](https://github.com/ParticlePudding/mdfolio/issues)\n\n## 使い方\n\n`mdfolio.html`（`dist/` の中）を開き、「フォルダを開く」でフォルダを選びます。試すなら `sample-docs` を開いてください。\n\n**見た目を変える**: `mdfolio.html` と同じフォルダに `mdfolio.css` を置きます。例は `examples/mdfolio.css` です。\n\n**人に渡す**: メニュー（⋯）の「サイトとして書き出す」で、文書を 1 つの HTML にまとめられます。見た目の CSS は、書き出しの画面の「CSS を選ぶ」で入れます。zip に入れて渡してください。\n\n## できること\n\n- 表、コードの色分け、数式、図（Mermaid）、脚注、アラート\n- ファイル一覧、目次、全文検索\n- ライト／ダーク、日本語／英語、印刷\n- ファイルを保存すると自動で再表示（Chrome / Edge）\n\n## 安全性\n\n- 文書は外部に送信しません。\n- 文書の中のスクリプトは実行しません。\n- インターネット上の画像は、初期設定では読み込みません。\n\n## 主な制約\n\n- 文字コードは UTF-8、UTF-16（BOM 付き）、Shift_JIS だけです。\n- Mermaid のマインドマップとアーキテクチャ図は使えません。\n- Firefox / Safari では、「前回のフォルダを開く」と自動再表示は使えません。\n- スマートフォンの実機では確認していません。\n\n## 設定\n\nHTML の中の `id=\"mdv-config\"` の行で、タイトル、言語、テーマなどを変えられます。詳しくは `sample-docs/reference/設定.md` を見てください。\n\n## 再配布について\n\n- `dist/mdfolio.html` と、そこから書き出したサイトの HTML は、そのまま再配布できます。必要な著作権表示と許諾表示は HTML の中に入っています。\n\n## 開発者向け\n\nビルドとテストには Node.js 20 以降を使います（利用者には要りません）。\n\n```\nnpm run build        # dist/ を作る\nnpm install          # テストの準備\nnpm test             # ビルド → 単体テスト → ブラウザーでのテスト\n```\n\n書き出しを自動化したいときは、コマンドでも書き出せます。\n\n```\nnode tools/build-site.mjs \u003c文書フォルダ> --out site.html --title \"手順書\" --css mdfolio.css\n```\n\n仕様は `docs/SPEC.md`、変更履歴は `CHANGELOG.md` にあります。\n\n## ライセンス\n\nMIT（`LICENSE`）。同梱ライブラリは `THIRD-PARTY-NOTICES.txt`。\n"},{"path":"_sidebar.md","kind":"doc","mtime":1794921899904,"text":"- [はじめに（README）](README.md)\n- 作成の記録\n  - [仕様書](SPEC.md)\n  - [仕様レビュー記録](REVIEW.md)\n  - [テスト報告書](TEST_REPORT.md)\n"},{"path":"REVIEW.md","kind":"doc","mtime":1794921899904,"text":"# mdfolio 仕様レビュー記録\n\n| 項目 | 内容 |\n|---|---|\n| 対象 | SPEC.md 0.9（レビュー前ドラフト） |\n| 実施日 | 2026-11-13 |\n| レビュー者 | 仕様の作成者自身（Claude）によるセルフレビュー。**第三者によるレビューではない** |\n| 結果 | 指摘 41 件（高 6 / 中 19 / 低 16）。すべて SPEC.md 1.0 に反映、または実装方針として記録した |\n| 判定 | 実装に進んでよい（残課題は 4 章） |\n| その後 | 実装・テストの段階で、このレビューでは見つけられなかった問題が 16 件見つかった（5 章）。仕様は 1.1 に改訂した。1.0.1 で、別のページの中に埋め込んだ表示に対応し、仕様を 1.2 に改訂した（6 章） |\n\n---\n\n## 1. レビュー方法\n\n1. **机上レビュー**: 次の観点のチェックリストで仕様書を通読した。\n   - 要求の充足（依頼内容: ローカルの HTML / JS で動く、Markdown 文書の表示サイト、再配布可能、テスト済み）\n   - 実現性（ブラウザの制約下で本当に動くか）\n   - セキュリティ（第三者の Markdown を開いたときの安全性）\n   - ライセンス（再配布時の義務を満たせるか）\n   - 整合性・曖昧さ（未定義の動作、矛盾、解釈が割れる記述）\n   - テスト容易性（各要件を検証できるか）\n2. **実機検証**: 実現性に関わる前提は、推測で済ませず実物で確かめた（2 章）。\n\n検証環境: Chrome for Testing 153.0.8010.12（ヘッドレス、Linux）、Node.js 22.23、Playwright 1.63。\n対象ライブラリ: markdown-it 15.0.3、markdown-it-footnote 4.0.0、DOMPurify 3.4.17、highlight.js 11.12.0、KaTeX 0.19.1、mermaid 12.3.0 / @mermaid-js/tiny 12.3.0。\n\n---\n\n## 2. 実機検証の結果\n\n| # | 確認した前提 | 結果 |\n|---|---|---|\n| V1 | `file://` で開いたページが安全なコンテキストとして扱われ、`showDirectoryPicker` が存在する | ○ `isSecureContext === true`、`showDirectoryPicker` / `showOpenFilePicker` とも関数として存在 |\n| V2 | `file://` で localStorage / IndexedDB / `history.replaceState` が使える | ○ いずれも動作 |\n| V3 | `file://` で OPFS（`navigator.storage.getDirectory`）が使える | **× `SecurityError`**。`http://127.0.0.1` では動作 |\n| V4 | CSP の `script-src` をハッシュのみにした状態で、動的に生成したインラインスクリプトが実行できる | ○ ハッシュが一致するスクリプトは実行され、一致しないスクリプトはブロックされた（違反イベント 1 件を確認） |\n| V5 | `unsafe-eval` なしの CSP で KaTeX が描画でき、`data:` URI のフォントが読み込める | ○ 描画成功、フォント読込エラー 0 件 |\n| V6 | 同じ CSP で Mermaid 軽量版が描画できる | ○ フローチャート、シーケンス、クラス、状態、ER、ガント、円、ジャーニー、Git グラフ、タイムライン、四象限、XY、サンキー、ブロックの 14 種が成功。Mindmap は失敗（軽量版の仕様どおり）。CSP 違反なし |\n| V7 | Mermaid 完全版と軽量版の中身 | 完全版（5.5MB）には ELK のコード（`org.eclipse.elk` の出現 345 箇所）と `new Function` 相当 9 箇所を確認。軽量版（2.9MB）は ELK 0 箇所。`elkjs` のライセンスは `EPL-2.0 OR GPL-3.0-or-later` |\n| V8 | Mermaid の構文エラー時の挙動 | `suppressErrorRendering: true` で、エラー図が DOM に残らず例外としてメッセージを受け取れる |\n| V9 | DOMPurify の設定（HTML プロファイル、`SANITIZE_NAMED_PROPS`、フック） | ○ `script` / `style` / `iframe` / `form` / インライン SVG・MathML、`on*` 属性、`javascript:` `data:` `file:` リンク、`target`、`data-*` が除去され、`id` / `name` に `user-content-` が付く。フック内のノードは不活性な文書に属しており、`src` を書き換える前に画像の読み込みが始まることはない |\n| V10 | DOMPurify が `style` 属性と `class` をどう扱うか | **そのまま通る**（`position:fixed; background:url(...)` が残った）。追加の対策が必要 |\n| V11 | markdown-it 15 の API と出力 | ○ 想定どおりの API。表の列揃えは `style=\"text-align:right\"` として出力される。`fuzzyLink: false` で `README.md` `main.py` `example.com` はリンク化されない |\n| V12 | `\u003cinput webkitdirectory>` で得られるファイル一覧 | ○ `webkitRelativePath` が `フォルダ名/…` の形で得られる。`.` で始まるフォルダや `node_modules` 配下もブラウザが列挙する |\n| V13 | `TextDecoder` の `shift_jis` / UTF-8 厳密モード / UTF-16 | ○ いずれも動作 |\n| V14 | フォルダハンドルを IndexedDB に保存し、読み戻して再利用できる | △ 通常プロファイルでは成功（再読み込み後も可）。Playwright 既定の一時プロファイルでは、読み戻し時にレンダラが異常終了した |\n| V15 | 常時読み込むライブラリを HTML にインライン化するためのエスケープ（`\u003c!--` `\u003cscript` `\u003c/script` の `\u003c` を `\\x3c` に置換） | ○ markdown-it（4 箇所）、DOMPurify（2 箇所）、highlight.js（2 箇所）とも置換後の構文チェックに成功 |\n| V16 | Firefox / WebKit をテスト環境に導入できるか | **× 不可**。ブラウザ配布元へのアクセスがネットワーク制限で拒否された |\n\n---\n\n## 3. 指摘事項と対応\n\n重大度: **高** = 設計・方針の変更が必要 ／ **中** = 仕様の追加・具体化が必要 ／ **低** = 記述の補足・明確化。\n\n### 3.1 実現性・テスト\n\n| ID | 重大度 | 指摘 | 対応 |\n|---|---|---|---|\n| RV-01 | 高 | `file://` で主要 API が使えることが未確認だった。OPFS は使えない（V3） | V1〜V3 で確認。OPFS を前提にしない。テスト方法を 10 章に明記 |\n| RV-02 | 高 | 遅延読み込みスクリプトが CSP ハッシュ方式で実行できるかが未確認。また、全スクリプトを動的生成にすると未検証ブラウザでのリスクが大きい | V4 で確認。常時読み込む分は通常のインラインスクリプトにし、動的生成は KaTeX / Mermaid に限定（8.2） |\n| RV-03 | 高 | `unsafe-eval` なしで KaTeX / Mermaid が動くかが未確認 | V5・V6 で確認。CSP から `unsafe-eval` を外したままとする（SEC-4） |\n| RV-04 | 高 | Mermaid 完全版はコピーレフト系ライセンスの `elkjs` を同梱しており（V7）、「寛容型ライセンスのみ同梱」の方針に反する | 軽量版を採用。非対応となる図を対象外に明記（1.4、8.4） |\n| RV-05 | 中 | Mermaid は構文エラー時に既定でエラー図を DOM に挿入するため、FR-206 のエラー表示と二重になる | `suppressErrorRendering` を使い、エラー表示は自前で行う（実装方針。V8） |\n| RV-06 | 中 | KaTeX が厳格モードの警告をコンソールに出力し、合格基準（コンソールエラーなし）の判定を紛らわしくする | KaTeX は `strict: 'ignore'` で呼び出す（実装方針） |\n| RV-07 | 高 | Firefox / Safari のエンジンをテスト環境に導入できない（V16）のに、0.9 では両者を無条件に「準対象」としていた | 2 章を「準対象・自動テスト未実施」に改め、標準 API ＋機能検出で実装する方針と、手動確認チェックリストの作成を明記（2 章、10 章） |\n| RV-08 | 中 | ネイティブのフォルダ選択ダイアログは自動操作できず、FR-101 の `showDirectoryPicker` 経路のテスト方法が未定義 | `file://` では差し替えハンドル、`http://127.0.0.1` では OPFS の実ハンドルで検証。ダイアログ自体は手動確認項目とする（10 章） |\n| RV-09 | 中 | 保存したフォルダハンドルの読み戻しが、一時プロファイルでは失敗しうる（V14） | FR-108 に「保存・復元に失敗した場合は機能を表示しないだけ」を追記。テストは通常プロファイルで行う |\n\n### 3.2 セキュリティ\n\n| ID | 重大度 | 指摘 | 対応 |\n|---|---|---|---|\n| RV-10 | 高 | DOMPurify は `style` 属性を素通しする（V10）。`url()` による外部リクエストや、`position:fixed` による画面の偽装が可能になる | SEC-3 を具体化（許可プロパティのホワイトリスト、`url()` 等を含む値と位置指定系プロパティの除去） |\n| RV-11 | 中 | 表の列揃えが `style` 属性で出力される（V11）ため、`style` を全面禁止にすると列揃えが壊れる | SEC-3 のホワイトリストに `text-align` を含め、その旨を明記 |\n| RV-12 | 中 | `class` も素通しのため、文書がアプリの部品（コピー用ボタン等）を装える | アプリ内部用クラス（`mdv-`）と `data-*` を利用者 HTML から除去（SEC-2） |\n| RV-13 | 中 | 添付へのリンクを blob URL のまま新しいタブで開くと、HTML の添付がアプリと同じオリジンで解釈される | 添付は常にダウンロード扱いとする（SEC-9、FR-211） |\n| RV-14 | 中 | 外部リクエストが起こり得る経路（`src` `srcset` `poster`、`style` の `url()`、`\u003ca ping>`、`\u003clink>`、`\u003cmeta refresh>`、`\u003cbase>`、`\u003cform>`）が網羅的に整理されていない | SEC-1 / SEC-3 と CSP の注記に反映。E2E で「リクエストが発生しない」ことを検証項目にする |\n| RV-15 | 低 | `file://` ではブラウザによって保存領域が他のローカル HTML と共有される | 保存内容を表示設定とフォルダハンドルに限定する旨を明記（5.6） |\n| RV-16 | 低 | インライン SVG / MathML、SVG 画像の扱いが未記載 | SEC-1（除去）、SEC-9（SVG 画像は `\u003cimg>` のみ）に明記 |\n\n### 3.3 仕様の抜け・曖昧さ\n\n| ID | 重大度 | 指摘 | 対応 |\n|---|---|---|---|\n| RV-17 | 中 | 対応する Markdown 記法の一覧がなく、「どこまで表示できるか」を判断できない | 3.2.1 を追加（自動リンクの範囲、数式の `$` の判定規則、改行規則を含む） |\n| RV-18 | 中 | 自動リンクで `README.md` や `main.py` のような文字列が URL と誤認される懸念（`.md` `.py` は実在の TLD） | スキーム付き URL とメールアドレスのみリンク化（3.2.1。V11 で確認） |\n| RV-19 | 中 | 複数の項目をドロップした場合のルートの決め方、サイトモードでのドロップが未定義 | FR-103 に追記 |\n| RV-20 | 中 | 文書セットを開いている状態で別のものを開いたときの動作が未定義 | FR-111 を追加（確認なしで置き換え） |\n| RV-21 | 中 | ファイルだけを開いた場合、画像やリンク先を解決できないことへの言及がない | FR-112 を追加 |\n| RV-22 | 中 | 閲覧モードでハッシュ付き URL を開いた（再読み込みした）場合の動作が未定義 | FR-304 に追記（開始画面を表示し、読み込み後にその文書へ移動） |\n| RV-23 | 中 | 検索の対象テキストと「関連度」の定義が曖昧 | FR-401 / FR-402 に明記 |\n| RV-24 | 中 | ハンドルを持たない読み込み方法では、選択後に変更されたファイルを再読込できない場合がある | FR-109 に追記（開き直しを促す） |\n| RV-25 | 低 | `\u003cinput webkitdirectory>` では除外対象もブラウザが列挙する（V12） | FR-106 に「アプリ側で除外」、11 章に所要時間の注意を追記 |\n| RV-26 | 低 | FR-110 の「エントリ」が何を指すか不明確 | 「ファイル・フォルダ」に修正 |\n| RV-27 | 中 | リンク解決で、`.html` へのリンク（静的サイトジェネレーター向けの文書に多い）と、`file:` URL・Windows 絶対パスの扱いが未定義 | 5.3 に `.html` → `.md` の読み替えと、絶対パスが機能しない旨を追記（11 章にも記載） |\n| RV-28 | 低 | 見出し ID の接頭辞（`user-content-`）と URL フラグメントの対応が未定義 | 5.2 に追記 |\n| RV-29 | 低 | テーマ切替時の図の再描画、印刷時の配色が未定義 | FR-501 / FR-504 に追記 |\n| RV-30 | 低 | 数式・図のライブラリが使えない場合（FR-603 で除外、または実行不可）の表示が未定義 | FR-205 / FR-206 / 8.2 に代替表示を追記 |\n| RV-31 | 低 | フォルダ走査の進捗表示、`showDirectoryPicker` 失敗時の切り替えが未記載 | FR-101 に追記 |\n| RV-32 | 低 | ツリーの並び順が利用者のロケールで変わりうる（配布したサイトの見え方が人によって変わる） | FR-301 に照合規則の固定を追記 |\n| RV-33 | 低 | FR-902「開始画面に留まる」は、既に文書セットを開いている場合に不適切 | 「それまでの表示を維持する」に修正 |\n| RV-34 | 低 | 文書を切り替えたときのフォーカスの扱いが未記載（キーボード・読み上げ利用時） | NFR-4 に追記 |\n\n### 3.4 ライセンス\n\n| ID | 重大度 | 指摘 | 対応 |\n|---|---|---|---|\n| RV-35 | 中 | HTML 内に内蔵するライセンス表記が第三者分のみで、自作部分（MIT）の表記が含まれていない | FR-802、9 章に自作部分を追加 |\n| RV-36 | 中 | 同梱ライブラリが内部に取り込んでいる依存（例: Mermaid 軽量版内の d3、lodash-es、DOMPurify 等）の表記が考慮されていない。また、ライブラリ更新時に意図しないライセンスが混入しても気づけない | 8.4 に依存分の表記を追記（取りこぼしを避けるため依存ツリーから安全側に列挙）。NFR-6 にライセンス検査を追加 |\n| RV-37 | 低 | KaTeX フォントのライセンスの扱いが未確認 | KaTeX パッケージの LICENSE（MIT）を収録する。フォントを SIL OFL 1.1 として扱う配布物もあるため、OFL 1.1 の全文も併せて収録する（実装方針） |\n\n### 3.5 その他\n\n| ID | 重大度 | 指摘 | 対応 |\n|---|---|---|---|\n| RV-38 | 低 | NFR-3（5MB 以下）は試算（約 4.4MB）に対して余裕が少ない | 6MB 以下に変更 |\n| RV-39 | 低 | 書き出しの合計サイズに関する扱いが未定義 | FR-602 に 100MB 超の警告を追記 |\n| RV-40 | 低 | CSP ハッシュ方式のため、経路上で HTML が書き換えられると動かなくなる | 6 章に注記、11 章に zip 配布の推奨を追記 |\n| RV-41 | 低 | 対象外の範囲が一部不明確（前へ／次へ、`[TOC]`、定義リスト） | 1.4 に追記 |\n\n---\n\n## 4. 残課題（レビューでは解消できなかったもの）\n\n| # | 内容 | 扱い |\n|---|---|---|\n| 1 | Firefox / Safari での動作は自動テストできない | 仕様上「自動テスト未実施」と明記。手動確認チェックリストをテスト報告書に付ける |\n| 2 | ネイティブのフォルダ選択ダイアログを経由した `showDirectoryPicker`、および `file://` で取得した実ハンドルの保存・復元（FR-108）は自動テストできない | 同上。失敗しても閲覧機能に影響しない設計とする |\n| 3 | Windows 実機（Edge）での確認は本環境ではできない | 同上（エンジンは同じ Chromium） |\n| 4 | Mermaid 軽量版に実際に含まれる依存ライブラリの正確な一覧は、配布物から機械的には確定できない | ライセンス表記は依存ツリーから安全側に列挙する（含まれていないものの表記が混ざる可能性はあるが、不足はしない） |\n\n---\n\n## 5. 実装・テスト後の追記（2026-11-13）\n\nこのレビューは仕様書と小さな実験に基づくもので、できあがった物を動かして確かめたわけではありません。実装後のテストで、レビューでは見つけられなかった問題が 16 件見つかりました。一覧と対応は [TEST_REPORT.md](TEST_REPORT.md) の 6 章にあります。レビューとしての反省点を残します。\n\n| 見落とし | なぜ見落としたか | 今後のレビューで確かめること |\n|---|---|---|\n| 図（Mermaid）の中の画像指定から、外部へ通信が発生した（T-08） | 「安全な設定で使う」という前提を、ライブラリの説明だけで信じた。RV の検証では、文書の `\u003cimg>` しか試していなかった | 「通信しない」のような性質は、経路を列挙して机上で潰すのではなく、実際に通信を観測して確かめる。第三者のライブラリが独自に持つ読み込み経路を疑う |\n| アクセシビリティの不備 5 件（T-13） | チェックリストが「名前を付ける」「コントラスト」程度で粗かった | 独立した検査エンジン（axe-core）を、レビューの検証の段階から使う |\n| スクロールバーを常に表示する環境での見た目の崩れ（T-15） | 検証に使ったブラウザーがスクロールバーを隠す設定だった | 検証環境が実際の利用環境と違う点（スクロールバー、フォント、ロケール）を先に洗い出す |\n| 大きな文書の表示時間が目標ぎりぎり（T-11） | 性能の目標値を、根拠となる計測なしに決めた | 目標値を決める前に、同梱ライブラリの処理時間を計っておく |\n\n残課題（4 章）の現状:\n\n- 1（Firefox / Safari）: Firefox のエンジン（Gecko 160）と Safari 系のエンジン（WebKitGTK 2.52）で、主要機能の自動確認ができた（V16 の時点では導入できないと判断していたが、同じエンジンを使う別の配布物を使えた）。製品版そのものでの確認は、引き続き手動確認の対象。\n- 2、3: 変わらず（手動確認の対象）。\n- 4: 変わらず。\n\n---\n\n## 6. 1.0.1 の変更についてのレビュー（2026-11-13）\n\nサンプルを公開ページ（別のページのフレームの中に表示するホスティング環境）に置くための変更について、仕様（SPEC.md 1.2）を実装の前後に見直した記録です。レビューアは実装者自身で、第三者によるものではありません。\n\n| # | 重要度 | 指摘 | 対応 |\n|---|---|---|---|\n| A-1 | **高** | ホスティング側がページへスクリプトを差し込む環境では、HTML に書いた CSP を外さないと動かない。外すと「外部と通信しない」ことを HTML 自身では保証できなくなる。それなのに開始画面が「外部には送信されません」と表示するのは、言いすぎになる | 変換後の HTML を「お試し用」と位置づけ、保証できない範囲を仕様に明記（6.1）。開始画面と使い方の文言を、お試し用の公開ページであることを伝えるものに差し替える設定（`hosted`）を追加 |\n| A-2 | 高 | フレームの制限で保存が止められる環境では、「サイトとして書き出す」と添付の保存が、押しても何も起きない操作になる | 設定 `allowDownloads` を追加し、該当する操作を画面に出さない。添付へのリンクは、保存できない旨の表示にする |\n| A-3 | 中 | 外部の画像を表示する切り替えも、ホスティング側の CSP で止められる環境では動かない。利用者が保存済みの「表示する」設定を持っている場合の扱いも決める必要がある | 設定 `lockExternalImages` を追加。切り替えの項目を出さず、保存済みの設定や `allowExternalImages` より優先する。起動時の CSP の追加（SEC-10）は変わらず行う |\n| A-4 | 中 | 文書間のリンクをブラウザーの既定の移動に任せていると、文書の URL とリンクの基準 URL が異なる環境（`srcdoc`）で、フレームが別のページへ移動する | 実験で再現を確認（Chromium）。アプリ内のリンクはアプリ自身が処理するよう変更（FR-211）。新しいタブで開く操作（修飾キー付きのクリック）はブラウザーに任せる |\n| A-5 | 中 | フレームの中では、クリップボードの API が許可されていないことがある。拒否を待ってから従来の方式に切り替えると、ブラウザーによっては「押した操作の中」と見なされず失敗する。また、従来の方式は失敗しても例外を出さないので、「コピーしました」と表示してしまう | フレームの中では従来の方式を先に試す。結果を確かめて、できなかったときは「コピーできませんでした」と表示する（FR-204） |\n| A-6 | 中 | スマートフォンでは、ファイル選択を拡張子で絞り込むと `.md` を選べない端末がある（種類の扱いが端末やアプリで異なる）。テスト環境では再現できない | 指で操作する端末では絞り込まない（FR-102）。予防的な変更であり、実機では確かめていないことを報告書に書く |\n| A-7 | 低 | `hosted` を、アプリ内の書き出しで作った HTML に引き継ぐと、手元で使う HTML に「公開ページです」と表示されてしまう | 書き出しでは引き継がない（5.4） |\n| A-8 | 低 | nonce 方式の CSP で配信する環境では、あとから読み込むライブラリ（数式・図）が実行されない | 既存のスクリプトの nonce を引き継ぐ（2.1）。対象のホスティング環境がこの方式かどうかは確認できていない |\n| A-9 | 中 | （公開の操作で判明）公開先は、置換文字（U+FFFD）を含むファイルを受け付けなかった。同梱ライブラリ（markdown-it）のスクリプトが、この文字そのものを 11 か所で使っている。レビューでは、公開先がファイルの内容を検査することを想定していなかった | 変換で、同じ意味のエスケープに書き換える（6.1）。書き換えの前後で、不正な入力の表示結果が変わらないことをテストで確認 |\n\n解消できなかったこと:\n\n- 実際のホスティング環境（Claude のアーティファクト）と、スマートフォンの実機では、動作を確かめられない。公開の操作そのものは成功した（A-9 の対処のあと、2 つのページを公開先が受け付けた）が、公開されたページを開いて表示と操作を確かめることはできなかった（確認に使えるブラウザーが、公開先にサインインしていなかった）。確かめたのは、公開されている説明をもとに条件を模したフレーム（別オリジン・サンドボックス・画像を `data:` / `blob:` に限る CSP・スクリプトの差し込み）と、タッチ操作を模したブラウザーである。実環境との違いが残る可能性があり、報告書（8 章）に未確認として記載した。\n- 配布済みの `mdfolio-1.0.0.zip` は、日本語のファイル名に UTF-8 の印が付いておらず、Windows の環境によっては、展開すると `sample-docs` のファイル名が文字化けする（報告書 T-19）。1.0.0 のレビューとテストでは、zip の中身のファイル名を Windows の扱いに照らして確かめていなかった。作り直した zip も、印が付いていることを機械的に確かめただけで、Windows の実機では展開していない。\n\n\n---\n\n## 7. フォルダ版（1.1.0）の仕様レビュー（2026-11-15）\n\nSPEC.md 8.6 を実装の前に見直した記録です。レビューアは実装者自身です。\n\n| # | 重要度 | 指摘 | 対応 |\n|---|---|---|---|\n| B-1 | **高** | `file://` では `\u003clink>` の CSS の中身をスクリプトから読めないため、ブラウザー内の書き出しは CSS を直接取り込めない。何もしないと、編集した CSS が書き出しに反映されないことに利用者が気づけない | 更新コマンドが CSS の写し（`data/styles.js`）を作り、書き出しはそれを使う。書き出しの画面に「CSS を変えたら先に更新コマンドを実行する」ことを表示する（FD-6） |\n| B-2 | 高 | `docs/` に Markdown を置いただけでは表示されない（`file://` では一覧を作れない）。理由が分からないと混乱する | 更新コマンドの実行が要ることを、使い方・README・`docs/` に置く説明ファイルに書く。`data/site.js` は必ず作っておき、文書がない状態でもエラーを出さない |\n| B-3 | 中 | スクリプトの許可が `'self'` になると、`file://` では同じ機械の任意のファイルが許可の範囲に入りうる（ブラウザーによる）。サニタイズ（SEC-1〜3）をすり抜けた場合の守りが弱くなる | 仕様に明記（8.6「安全面で単一 HTML と異なる点」）。外部のスクリプト（http / https）は引き続き実行されない。機密性の高い用途では単一 HTML 版を使う選択肢を残す |\n| B-4 | 中 | Firefox は `file://` の扱いが Chrome と異なる（サブフォルダのファイルの読み込み、`'self'` の解釈）。Chromium だけで確かめると見落とす | Gecko / WebKit の確認（`tests/cross/`）にフォルダ版の項目を加える |\n| B-5 | 中 | 図（Mermaid）の配色がスクリプトに固定されていると、CSS で配色を変えても図だけ元の色のままになり、「デザインの統一」という目的に反する | 図の配色を CSS の変数から取る（FD-4）。図のライブラリが解釈できない値の場合は既定の色に戻す |\n| B-6 | 低 | 配色の変数を利用者が変えると、文字と背景のコントラストが基準（4.5:1）を下回ることがある | `document.css` の冒頭に注意を書く。自動のアクセシビリティ検査は既定の配色に対して行う |\n| B-7 | 低 | 所定の文書の表示中に別のフォルダを開くと、戻る手段がないと所定の文書を見失う | メニューに「所定の文書に戻る」を置く（FD-2） |\n| B-8 | 低 | 単一 HTML と CSS が別々に保守されると、両者の見た目がずれる | ソースの CSS（`src/app.css`、`src/document.css`）を両方の形式で共有し、単一 HTML ではつなげて埋め込む |\n\n---\n\n## 8. 公開ページと文書の英語版の仕様レビュー（2026-11-16）\n\nSPEC.md 8.7 を実装の前に見直した記録です。レビューアは実装者自身です。\n\n| # | 重要度 | 指摘 | 対応 |\n|---|---|---|---|\n| C-1 | 中 | GitHub Pages は、ブラウザーの言語で返すページを変えられない。スクリプトで振り分けないと、英語の利用者も日本語の案内に着く | 案内の上部の目立つ位置に「English」のリンクを置く（PG-2）。英語の README からは英語の案内を直接指す。スクリプトでの転送は、戻るボタンの動きが分かりにくくなり、案内のページにスクリプトを入れることにもなるので行わない |\n| C-2 | 中 | 見本の画面の言語が `auto` のままだと、日本語の見本を英語のブラウザーで開いたとき、画面は英語・本文は日本語と食い違う | 公開ページの見本は、文書の言語に合わせて固定する（PG-3）。配布物（`dist/`）の見本は従来どおり `auto` のままにし、配布物を変えない |\n| C-3 | 中 | 日本語と英語の見本は、片方だけ更新されてずれていきやすい | 単体テストで、両方の文書の数、相対リンクと画像の参照先が実在することを確かめる（PG-4、PG-8） |\n| C-4 | 中 | 英語の文書の中で、画面の部品を独自の言葉で呼ぶと、実際の表示と合わず探せない | 英語の表示（`i18n.js` の `en`）の言葉をそのまま使う（PG-5） |\n| C-5 | 低 | 見本の図（`overview.svg`）に日本語の文字が入っている | 英語の文字の図を用意する |\n| C-6 | 低 | 仕様書・レビュー記録・テスト報告書は分量が多く（合わせて約 13 万字）、英語版を保守し続けるのは難しい | 英訳しない。英語の説明書と README にその旨を書く（PG-6） |\n| C-7 | 低 | 見本の検索の例（全角の「ｍｅｒｍａｉｄ」）は、英語では意味が伝わらない | 英語版では、大文字・小文字を区別しない例（`MERMAID`）に置き換える（PG-4） |\n| C-8 | 中 | （依頼者の指摘を受けて追加）アプリの HTML にはライセンス表記の全文が入っているが、公開ページの案内には「メニューで見られる」と書いてあるだけで、全文がない | 案内のページにも全文を載せる。長い（約 10 万字）ので折りたたみの欄に入れる。スクリプトを使わずに開けるよう `\u003cdetails>` を使う。全部の公開ページに全文が入っていることを単体テストで確かめる（PG-9） |\n\n---\n\n## 9. 1.2.0 の仕様レビュー（2026-11-16）\n\nSPEC.md 1.7 の変更を実装の前に見直した記録です。レビューアは実装者自身です。\n\n| # | 重要度 | 指摘 | 対応 |\n|---|---|---|---|\n| D-1 | **高** | 自動実行（AU-1、AU-2）は `gh-pages` ブランチとリリースを書き換える権限を持つ。第三者のアクションを使うと、その作者が書き換えた内容がそのまま実行される | 第三者のアクションは使わない（AU-4）。公開とリリースは、実行環境に入っている `git` と `gh` コマンドで行う。権限は `contents: write` だけにする |\n| D-2 | 中 | 単体テストに失敗した版が公開されると、公開ページが壊れる | 単体テストを先に行い、失敗したら公開しない（AU-1）。ブラウザーのテスト（E2E）は時間がかかり、ブラウザーの準備も要るので、自動実行には入れない。開発の手順で実行する |\n| D-3 | 中 | タグの版と `package.json` の版が食い違うと、リリースの名前と中身の版が合わなくなる | 一致しなければ止める（AU-2） |\n| D-4 | 中 | 更新コマンドの言語を OS の設定だけで決めると、テストの結果が実行する機械によって変わる | 環境変数 `MDFOLIO_LANG` で固定できるようにし、テストではこれを指定する（FD-10） |\n| D-5 | 中 | `LANG=C`（言語の指定なし）の環境は、日本語の Windows には少ないが、Linux や Mac の端末ではよくある。英語になる | 英語にする（`ja` 以外は英語）。日本語にしたい場合は `MDFOLIO_LANG=ja` を使えることを `はじめに.txt` と `--help` に書く |\n| D-6 | 低 | フォルダ版の見本の文書（`docs/`）は日本語だけ | 配布物の `docs/` は見本なので日本語のままにし、英語の見本（`sample-docs-en/`）の使い方を `README.txt` に書く。公開ページには英語の見本のフォルダ版がある |\n| D-7 | 低 | 書き出しの CSS を指定する案（A7）は、用途が検証だけ | 行わない。代わりに、画面と書き出しが食い違う条件（更新コマンドの実行忘れ）を既知の制約に書く |\n| D-8 | 低 | ライセンス表記に、実際には入っていない依存ライブラリまで載せている（4 章の残課題 4）。依頼者から意図を問われた | 方針は変えない。表記が足りないとライセンス違反になるが、余分にあっても問題はない。Mermaid の軽量版は 1 つのファイルに圧縮されていて、どの依存ライブラリのコードが入ったかを機械的に確かめられないため、依存しうるものをすべて載せている |\n| D-9 | 低 | `dist/hosted/` を消すと、1.0.1 で公開したお試し用のページ（Claude のアーティファクト）の元のファイルがなくなる | 変換の道具（`make-hosted.mjs`）は残すので、いつでも作り直せる。公開済みのページそのものは消えない |\n| D-10 | 中 | 英語の文章は、日本語を母語とする書き手（実装者）による翻訳で、不自然な表現が残っている可能性がある。依頼者の環境では英語を母語とする人の確認を得にくい | 経緯を伝えない別の AI（同じ系統のモデル）に英語の文章だけを読ませ、指摘を受けて直す。主な指摘は、日本語の直訳（\"screen\" を画面全体の意味で使う、\"fixed place\"、\"character width\"）と、アプリの動作と食い違う記述（外部の画像を表示に切り替えたあとの再読み込みは自動で行われる）、\"folder edition\" という表記の揺れ、画面の英語の単数・複数（\"1 results\"）。そのあと、依頼者が別の会社の AI（2 つ）に読ませた指摘も受けて直した（直訳調の \"nothing but\"、\"hand over\"、動詞の使い分け、画面の英語の文言など）。指摘は実装と照らしてから採り、意味が変わる案（例: 更新コマンドを「mdfolio のフォルダの中から実行する」と言い換える案。実際は「フォルダの中にある update.mjs を実行する」の意味）は採らなかった。母語話者の確認の代わりにはならないので、英語の README と案内のページで、表現の誤りを GitHub の Issues で知らせてもらうよう呼びかける |\n\n---\n\n## 10. 1.3.0 の仕様レビュー（隣の CSS、フォルダ版の廃止。2026-11-17）\n\nSPEC.md 1.9 を実装の前に見直した記録です。レビューアは実装者自身です。\n\n| # | 重要度 | 指摘 | 対応 |\n|---|---|---|---|\n| E-1 | **高** | `file://` で開いたページは、隣の CSS を画面に効かせられても、中身を読めない（実験で確認。Chromium で `cssRules` は `SecurityError`、`fetch` は失敗）。何もしないと、利用者は画面の見た目のまま書き出されると思い込む | 書き出しの画面で、隣の CSS が効いているのに中身を読めないときは「書き出しには入らない。入れるには同じファイルを選ぶ」と表示する（FR-1004）。選んだ CSS は埋め込む（FR-1002） |\n| E-2 | 中 | 隣に `mdfolio.css` がないとき、ブラウザーは読み込みに失敗し、開発者向けの表示にエラーを出す。自動テストは「エラーなし・通信なし」を合格の条件にしている | 利用者の操作には影響しないので、仕様として受け入れる（3.10 安全面）。テストの道具は、隣の `mdfolio.css` への 1 回の読み込みとその失敗だけを除外する。それ以外の通信とエラーは従来どおり不合格にする |\n| E-3 | 中 | CSP の `style-src` を広げると、文書が別の CSS を読み込ませる余地が増えるのではないか | 文書の中の `\u003clink>`・`\u003cstyle>` はサニタイズで取り除く（SEC-1〜3）。広げるのは `'self' file:`（同じ配信元と手元のファイル）だけで、外部のサーバーの CSS は読めない。スクリプトの許可は変えない |\n| E-4 | 中 | 書き出したサイトの中で、さらに書き出したとき、埋め込まれた CSS が失われると見た目が変わる | 今の HTML に埋め込まれた CSS は、既定で引き継ぐ（FR-1003） |\n| E-5 | 中 | 埋め込む CSS に `\u003c/style` が含まれると、HTML が壊れる | 受け付けず、理由を表示する（FR-1005）。コマンドライン版も同じ |\n| E-6 | 中 | フォルダ版を配った利用者がいる（1.1.0、1.2.0） | 変更履歴とリリースの説明で廃止を知らせる。移行先は「単一 HTML と隣の `mdfolio.css`」。古い版はリリースから引き続き入手できる |\n| E-7 | 低 | 別のページの中（`srcdoc`）に埋め込んだ場合、相対パスの `mdfolio.css` は外側のページの場所を基準に探される | 外側のページの持ち主の CSS が効くだけで、安全上の問題はない。既知の動作として扱う |\n| E-8 | 低 | 公開ページのフォルダ版の見本がなくなる | 代わりに「見た目の見本」（書き出しの見本の隣に `mdfolio.css` を置いたもの）を置き、隣の CSS で見た目が変わることを示す |\n\n"},{"path":"SPEC.md","kind":"doc","mtime":1794921899904,"text":"# mdfolio 仕様書\n\n| 項目 | 内容 |\n|---|---|\n| 版 | 1.9（隣の CSS による見た目の上書き。フォルダ版を廃止） |\n| 日付 | 2026-11-13 |\n| 対象 | ローカルの HTML / JavaScript だけで動く Markdown 文書表示サイト |\n| 関連文書 | [REVIEW.md](REVIEW.md)（仕様レビュー記録）、[TEST_REPORT.md](TEST_REPORT.md)（テスト報告書） |\n\n---\n\n## 1. 概要\n\n### 1.1 目的\n\nローカルにある Markdown 文書群を、**サーバー・ビルドツール・インストール・ネット接続なし**に、ブラウザだけで「文書サイト」として閲覧・配布できるようにする。\n\n### 1.2 利用シナリオ\n\n| ID | シナリオ | 概要 |\n|---|---|---|\n| S1 | 自分の文書フォルダを閲覧する | `mdfolio.html` をダブルクリックで開き、文書フォルダを選ぶ。ツリー・文書間リンク・全文検索つきで閲覧する（**閲覧モード**） |\n| S2 | 文書をまとめて配布する | 開いている文書一式を、文書を埋め込んだ単一 HTML（以下「サイト HTML」）として書き出す |\n| S3 | 配布されたサイト HTML を読む | 受け取った人は HTML をダブルクリックするだけで読める。操作・導入は不要（**サイトモード**） |\n| S4 | 単一の `.md` をさっと見る | ファイルをウィンドウにドロップして表示する |\n\n### 1.3 前提・制約（ブラウザ仕様に由来するもの）\n\n| ID | 制約 | 本仕様での対応 |\n|---|---|---|\n| C1 | `file://` で開いたページは `fetch` / `XMLHttpRequest` でローカルファイルを読めない | 通信 API を一切使わない。文書は (a) 利用者によるフォルダ／ファイルの選択、(b) HTML 内への埋め込み、のいずれかで取得する |\n| C2 | `file://` では ES Modules（`type=\"module\"`）を読み込めない | クラシックスクリプトのみで構成する |\n| C3 | ページは利用者の操作なしに任意のローカルパスを読めない | フォルダ選択・ドロップ・埋め込みで対応する |\n| C4 | オフライン環境で使う | CDN 等の外部リソースを参照しない。必要なライブラリ・フォントはすべて HTML に内蔵する |\n\n### 1.4 対象外（本バージョンでは実装しない）\n\n- Markdown の編集機能\n- サーバー上の `.md` を HTTP で逐次取得して表示する方式（docsify 方式）\n- PDF 直接出力（ブラウザの印刷機能で代替）\n- 絵文字ショートコード（`:smile:`）、Wiki リンク（`[[...]]`）、`[TOC]`、定義リスト\n- Mermaid の Mindmap / Architecture 図（同梱する軽量版 Mermaid が非対応のため）\n- 前後の文書への「前へ／次へ」リンク\n\n---\n\n## 2. 動作環境\n\n| ブラウザ | 位置づけ | 備考 |\n|---|---|---|\n| Microsoft Edge / Google Chrome（最新の安定版、PC） | **主対象・テスト済み**（Chromium エンジン） | 全機能 |\n| Firefox / Safari（最新の安定版、PC） | 準対象・**エンジン単位の簡易確認のみ** | 標準 API のみで実装し、機能検出で分岐する。フォルダはファイル選択ダイアログ方式で開く。「前回のフォルダを開く」「自動更新」は非対応（ボタンを表示しない）。Firefox のエンジン（Gecko 160）と Safari 系のエンジン（WebKitGTK 2.52）で主要機能の自動確認を行った（10 章）。製品版の Firefox / Safari そのものでは未確認 |\n| iOS / Android のブラウザ | サイト HTML の閲覧と「ファイルを開く」を想定・**実機では未検証** | 幅 390px・タッチ操作を模した環境での自動テストのみ行った。フォルダを開く操作は保証しない |\n| Internet Explorer | 非対応 | |\n\n- 起動方法: HTML ファイルをブラウザで直接開く（`file://`）。Web サーバーに置いた場合（`http(s)://`）も同じく動作する。\n- 実行に必要なもの: 上記ブラウザのみ。\n- 主な操作は PC（マウス・キーボード）を想定する。タッチ操作でも基本的な閲覧はできる。\n\n### 2.1 別のページの中に埋め込んで表示する場合\n\nHTML を `\u003ciframe>` の中に表示する環境（文書管理システムのプレビュー、HTML を配信するホスティングサービスなど）でも、閲覧に必要な機能が動くようにする。\n\n| 条件 | 動作 |\n|---|---|\n| 文書の URL とリンクの基準 URL が異なる（`srcdoc` での埋め込みなど） | 文書間のリンクはアプリ自身が処理する（FR-211）。ブラウザーに任せると、フレームが別のページへ移動して表示が消えるため |\n| 保存領域（localStorage / IndexedDB）が使えない | 設定はその場かぎりで切り替わる（FR-702）。「前回のフォルダを開く」は表示しない |\n| フォルダ選択 API が拒否される（別オリジンのフレーム） | `\u003cinput>` 方式に切り替わる（FR-101） |\n| クリップボードの API が許可されていない | 従来の方式でコピーし、できなければ「コピーできませんでした」と表示する（FR-204） |\n| ページを nonce 方式の CSP で配信している | あとから読み込むライブラリ（数式・図）にも同じ nonce を引き継ぐ |\n| ファイルの保存・外部の読み込み・ダイアログがフレームの制限で止められる | 設定（5.4 の `allowDownloads` / `lockExternalImages`）で、該当する操作を画面に出さないようにできる |\n\nページの中へ独自のスクリプトを差し込む種類のホスティング環境では、HTML に書いた CSP（SEC-4）がそのスクリプトを止めてしまう。こうした環境に置く場合は、`tools/dev/make-hosted.mjs` で CSP を取り除いて上記の設定を入れた「お試し用」の HTML に変換する（6.1）。\n\n---\n\n## 3. 機能要件\n\n優先度: **必須** = 本バージョンで必ず満たす ／ **推奨** = 本バージョンで実装するが、ブラウザ非対応時は機能を隠す。\n\n### 3.1 文書の読み込み\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-101 | 必須 | **フォルダを開く**: ボタン操作でフォルダを選択し、配下を再帰的に走査して文書セットを作る。File System Access API（`showDirectoryPicker`）が使えるブラウザではそれを使い、使えない場合・拒否された場合（利用者によるキャンセルを除く）は `\u003cinput type=\"file\" webkitdirectory>` に自動で切り替える。走査中は進捗（件数）を表示する |\n| FR-102 | 必須 | **ファイルを開く**: 1 つ以上の Markdown ファイルを選択して開く。PC では選択ダイアログを Markdown の拡張子に絞り込む。指で操作する端末（主な入力がタッチの端末）では絞り込まない（`.md` の種類の扱いが端末や保存先のアプリによって異なり、絞り込むと選べないことがあるため）。Markdown 以外だけを選んだ場合は FR-902 のとおり通知する |\n| FR-103 | 必須 | **ドラッグ＆ドロップ**: ファイルまたはフォルダをウィンドウにドロップして開く。フォルダを 1 つだけドロップした場合はそのフォルダをルートとし、それ以外（複数、またはファイル）はドロップした項目をルート直下に並べる。サイトモードではドロップを受け付けない |\n| FR-104 | 必須 | **埋め込みデータ**: HTML 内にサイトデータ（5.5）があれば、起動時にそれを文書セットとして読み込む（サイトモード） |\n| FR-105 | 必須 | **対象ファイル**: 拡張子 `.md` `.markdown` `.mdown` `.mkd` `.mkdn` `.mdwn` `.mdtxt` `.mdtext`（大文字小文字を区別しない）を「文書」とする。それ以外のファイルは「添付」とし、文書から画像・リンクとして参照されたときに初めて読み込む |\n| FR-106 | 必須 | **除外**: 名前が `.` で始まるフォルダ・ファイル、および `node_modules` フォルダは読み込まない（どの読み込み方法でもアプリ側で除外する） |\n| FR-107 | 必須 | **文字コード**: UTF-8（BOM 有無）、UTF-16（BOM 付き）、Shift_JIS（CP932）を自動判定する。判定順は BOM → UTF-8 厳密デコード → Shift_JIS 厳密デコード → UTF-8（不正バイトは置換文字） |\n| FR-108 | 推奨 | **前回のフォルダを開く**: `showDirectoryPicker` で開いたフォルダのハンドルを保存し、次回は開始画面からワンクリック（＋ブラウザの許可確認）で開ける。保存・復元に失敗した場合は機能を表示しないだけで、エラーにしない |\n| FR-109 | 推奨 | **再読み込み**: メニューからフォルダの再走査と表示中文書の再読込ができる。`showDirectoryPicker`（またはハンドルが得られるドロップ）で開いた場合は、表示中の文書ファイルの更新を約 2 秒間隔で検知し、スクロール位置を保ったまま自動で再表示する。ハンドルがない読み込み方法では、ファイルが選択後に変更されていると再読込できないことがあり、その場合は開き直しを促す |\n| FR-110 | 必須 | **上限**: 文書 5,000 件、走査するファイル・フォルダ 50,000 件まで。超過分は読み込まず、その旨を通知する。10MB を超える文書は Markdown 変換せずプレーンテキストとして表示する |\n| FR-111 | 必須 | **置き換え**: 文書セットを開いている状態で別のフォルダ・ファイルを開いた場合は、確認なしで文書セットを置き換え、ホーム文書を表示する |\n| FR-112 | 必須 | **単一ファイル時の扱い**: フォルダではなくファイルだけを開いた場合、同時に選択していない画像・リンク先は解決できない。画像のプレースホルダに「フォルダとして開くと表示できる」旨を表示する |\n\n### 3.2 表示（レンダリング）\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-201 | 必須 | CommonMark と GFM 拡張（表・打ち消し線・タスクリスト・URL／メールアドレスの自動リンク）を表示できる。対応記法は 3.2.1 のとおり |\n| FR-202 | 必須 | 脚注（`[^1]`）を表示できる |\n| FR-203 | 必須 | 見出しに ID を付与し、見出し横にアンカーリンクを表示する。ID は GitHub 方式（小文字化・記号除去・空白をハイフン化、日本語は保持、重複は `-1` `-2` を付加） |\n| FR-204 | 必須 | コードブロックを言語指定に応じてシンタックスハイライトする（言語指定がない・未対応の場合はハイライトなし）。各コードブロックに言語名とコピー用ボタンを表示する。コピーできなかった場合は、できたことにせず「コピーできませんでした」と表示する。フレームの中では、押した操作の中で同期的にコピーする方式を先に試す（非同期の API が拒否されるのを待つと、その後のコピーを受け付けないブラウザーがあるため）。色分けはサニタイズの後に行い、色分けの結果もサニタイザーを通してから挿入する。コードの文字が変わる場合は色分けしない。1 文書につき 20,000 文字または 60 ブロックを超える分は、表示のあとで画面に近いものから順に処理する（印刷の前には残りをまとめて処理する） |\n| FR-205 | 必須 | 数式（KaTeX）: インライン `$...$`、ディスプレイ `$$...$$`、および ```` ```math ```` ブロック。構文エラーの箇所はエラー表示にし、文書全体の表示は続ける。ライブラリが使えない場合は数式の原文を表示する |\n| FR-206 | 必須 | 図（Mermaid）: ```` ```mermaid ```` ブロックを図として表示する。構文エラー時はエラーメッセージと元のコードを表示する。ライブラリが使えない場合は元のコードを表示する |\n| FR-207 | 推奨 | GitHub 形式のアラート（`> [!NOTE]` `[!TIP]` `[!IMPORTANT]` `[!WARNING]` `[!CAUTION]`） |\n| FR-208 | 必須 | YAML フロントマター（先頭の `---` 〜 `---`）は本文に表示しない。`title` があれば文書タイトルに使う |\n| FR-209 | 必須 | Markdown 中の生 HTML は、サニタイズ（6 章）した上で表示する |\n| FR-210 | 必須 | **画像・メディア**: 相対パスは文書セット内のファイルに解決して表示する。見つからない場合はプレースホルダを表示する。外部（`http(s)://`）の画像・メディアは既定でブロックしてプレースホルダを表示し、設定で許可できる。ブロックは表示処理に加えて CSP でも行う（SEC-10）。許可へ切り替えるときは、接続先が増えることを確認した上でページを再読み込みする（閲覧モードでは開いているフォルダが閉じる）。ブロックへ戻すときは、その場で反映する |\n| FR-211 | 必須 | **リンク**: 文書セット内の文書へのリンクはアプリ内で遷移する。`#見出し` はページ内移動。アプリ内のリンク（`#` で始まるもの）のクリックはアプリ自身が処理し、ブラウザーの既定の移動に任せない（2.1。修飾キー付きのクリックなど、新しいタブで開く操作はブラウザーに任せる）。外部リンクは新しいタブで開く。文書セット内の添付ファイルへのリンクはダウンロードとして保存する（ブラウザ内では開かない）。添付のパスを URL で直接開いた場合は、ダウンロード用のボタンを表示する。設定で保存を使わないようにしている場合（5.4 の `allowDownloads: false`）は、保存を始めず、保存できない旨を表示する（押しても動かないボタンは出さない）。解決できないリンクは遷移先で「見つかりません」を表示する |\n| FR-212 | 必須 | 横に長い表・コード・数式・図は、その要素内で横スクロールできる。実際にはみ出している要素は、キーボードでフォーカスして矢印キーでスクロールできる（画面の幅が変わったら判定し直す） |\n| FR-213 | 必須 | **文書タイトル**: フロントマターの `title` → 最初の H1 → ファイル名 の順で決定し、ブラウザのタブタイトルにも反映する |\n\n#### 3.2.1 対応記法\n\n| 記法 | 対応 | 備考 |\n|---|---|---|\n| 見出し（`#`、下線式）、段落、強調、打ち消し線（`~~`） | ○ | |\n| リスト（入れ子・番号）、タスクリスト（`- [ ]` `- [x]`） | ○ | チェックボックスは表示のみ（操作不可） |\n| 引用、アラート（`> [!NOTE]` 等） | ○ | |\n| コード（インライン、フェンス、言語指定） | ○ | ハイライト対応言語は highlight.js の標準セット＋追加言語（一覧は README） |\n| 表（列の左・中央・右揃え） | ○ | |\n| リンク（インライン・参照式）、画像 | ○ | |\n| 自動リンク | △ | `http(s)://` で始まる URL とメールアドレスのみ。`www.example.com` や `README.md` のような文字列はリンクにしない |\n| 脚注 | ○ | |\n| 数式 | ○ | インラインは、開き `$` の直後と閉じ `$` の直前が空白でなく、閉じ `$` の直後が数字でない場合のみ数式とみなす（`$5 と $10` のような金額表記は数式にならない）。`\\$` で `$` そのもの |\n| Mermaid | ○ | フローチャート、シーケンス、クラス、状態、ER、ガント、円、ジャーニー、Git グラフ、タイムライン、四象限、XY、サンキー、ブロック |\n| 生 HTML | △ | 書式・表・`details`・`img`・`video`/`audio` 等。スクリプト・フォーム等は除去（6 章） |\n| 改行 | ○ | 行末の空白 2 つまたは `\\` で改行。単なる改行は改行にならない（CommonMark 準拠） |\n| フロントマター（YAML） | △ | 非表示。`title` のみ利用 |\n\n### 3.3 ナビゲーション\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-301 | 必須 | **サイドバー（ファイルツリー）**: フォルダ階層をツリー表示し、フォルダは開閉できる。表示中の文書を強調する。並び順は「ファイル → フォルダ」、各階層のファイルは `README` / `index` を先頭、以降は自然順（数字を数値として比較。利用者の環境によらず同じ順になるよう照合規則を固定する）。表示名は拡張子を除いたファイル名 |\n| FR-302 | 推奨 | **カスタムナビ**: 文書セットのルートに `_sidebar.md` または `SUMMARY.md`（大文字小文字を区別しない。両方あれば `_sidebar.md`）があれば、その内容（リンクの入れ子リスト）をサイドバーに表示する。リンクはルート基準で解決する。「ナビ／ファイル」を切り替えられる |\n| FR-303 | 必須 | **ページ内目次**: 表示中の文書の見出し（H1〜H4）を一覧表示し、スクロール位置に応じて現在位置を強調する。文書の末尾までスクロールしたときは、最後の見出しを現在位置とする。見出しが 2 つ未満の文書では表示しない |\n| FR-304 | 必須 | **ルーティング**: 表示中の文書と見出し位置を URL ハッシュに反映する（5.2）。ブラウザの「戻る／進む」で移動できる。サイトモードではハッシュ付き URL を直接開くとその文書・位置が表示される。閲覧モードでハッシュ付き URL を開いた場合は開始画面を表示し、文書セットの読み込み後にその文書へ移動する |\n| FR-305 | 必須 | 文書の上部に、文書セット内でのパスと更新日時（取得できる場合）を表示する |\n| FR-306 | 推奨 | 「戻る／進む」で移動したときは、以前のスクロール位置を復元する |\n| FR-307 | 必須 | **ホーム文書**: 設定の `home` → ルートの `README.md` → ルートの `index.md` → ツリー順で最初の文書 の順で決定する（大文字小文字を区別しない） |\n\n### 3.4 検索\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-401 | 必須 | 文書セット全体を対象に全文検索できる。対象は各文書のタイトル・見出し・パス・本文（Markdown の記法記号を取り除いたテキスト。コードを含む）。空白区切りの複数語は AND 条件。大文字小文字・全角半角（英数字・カナ）を区別しない。カスタムナビ（FR-302）に使っているファイルは目次であって本文ではないため、検索結果には出さない（ファイル一覧からは開ける） |\n| FR-402 | 必須 | 結果は関連度順（タイトル・見出し・パスでの一致を優先、次に本文の一致数）に最大 50 件、文書タイトル・パス・一致箇所の抜粋（一致語を強調）を表示する。↑↓ で選択、Enter で開く、Esc で閉じる |\n| FR-403 | 必須 | 結果から文書を開いたとき、本文中の一致語をハイライトし、最初の一致位置へスクロールする |\n| FR-404 | 必須 | 検索索引は読み込み後にバックグラウンドで作成する。作成中でも作成済みの範囲で検索でき、進捗を表示する |\n| FR-405 | 必須 | `Ctrl+K`（macOS は `⌘K`）または `/` で検索欄にフォーカスする |\n\n### 3.5 表示設定\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-501 | 必須 | テーマ: 自動（OS 設定に追従）／ライト／ダーク を切り替えられる。切り替え時は図（Mermaid）も配色を合わせて再描画する |\n| FR-502 | 必須 | UI 言語: 日本語／英語。既定はブラウザの言語設定に従う |\n| FR-503 | 必須 | 画面幅に応じてレイアウトを切り替える（4.1） |\n| FR-504 | 必須 | 印刷時は本文のみを、常にライト配色で出力する（ヘッダー・サイドバー・目次・ボタン類を隠す） |\n\n### 3.6 サイト書き出し\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-601 | 必須 | 開いている文書セットを、文書を埋め込んだ**単一のサイト HTML** として保存できる（設定で保存を使わないようにしている場合は、メニューに出さない）。書き出しダイアログでサイトタイトルとホーム文書を指定でき、文書数・添付数・概算サイズを確認できる |\n| FR-602 | 必須 | 文書から参照されている添付（画像・リンク先ファイル）のうち文書セット内に存在するものを埋め込む。1 ファイル 20MB を超えるものは埋め込まず、件数をダイアログで通知する。合計が 100MB を超える場合は警告を表示する（続行は可能） |\n| FR-603 | 推奨 | どの文書でも数式／図を使っていない場合、該当ライブラリ（KaTeX／Mermaid）をサイト HTML から除外してサイズを減らす。除外したライブラリのハッシュは CSP からも外す |\n| FR-604 | 推奨 | 同じ書き出しをコマンドラインから実行できるツール（Node.js。開発者・自動化向け。リポジトリにだけ置き、利用者向けの説明とリリースの zip には含めない）を用意する。設定（5.4）のうち `allowExternalImages` / `lockExternalImages` / `allowDownloads` は、オプション（`--allow-external-images` / `--lock-external-images` / `--no-downloads`）で指定できる |\n| FR-605 | 必須 | コマンドライン版の書き出しの表示（結果、注意、エラー、`--help`）は日本語と英語。言語は、環境変数 `MDFOLIO_LANG`（`ja` / `en`）、なければ `LC_ALL`・`LC_MESSAGES`・`LANG`、なければ OS の言語設定の順で決め、`ja` で始まれば日本語、それ以外は英語にする（1.2.0 の FD-10 から移した） |\n\n### 3.7 設定・状態の保存\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-701 | 必須 | HTML 内の設定ブロック（5.4）で、サイトタイトル・既定テーマ・既定言語・ホーム文書・外部画像の既定許可を指定できる。加えて、表示する環境に合わせるための指定（保存を伴う操作を出さない、外部の画像を常に読み込まない、お試し用の公開ページであることを表示する）ができる |\n| FR-702 | 必須 | 利用者が変更した設定（テーマ・言語・外部画像・サイドバー開閉）はブラウザに保存し、次回に引き継ぐ。保存できない環境でもエラーにせず動作する。ただし外部画像の許可は再読み込みをまたいで設定を引き継ぐ必要があるため、保存できない環境では切り替えられないことを通知する |\n\n### 3.8 ヘルプ・ライセンス表示\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-801 | 必須 | 使い方（ヘルプ）をアプリ内で表示できる。お試し用の公開ページ（5.4 の `hosted: true`）では、使えない機能があることを先頭に表示する |\n| FR-802 | 必須 | バージョン情報と、本ソフトウェアおよび同梱している第三者ソフトウェアのライセンス表記全文をアプリ内で表示できる |\n\n### 3.9 エラー処理\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-901 | 必須 | ファイルの読み込み失敗・権限拒否・非対応機能・上限超過・書き出し失敗は、画面上の通知で利用者に知らせる。JavaScript の例外で画面が止まらない |\n| FR-902 | 必須 | 文書セットに Markdown 文書が 1 件もない場合は、その旨を通知し、それまでの表示を維持する |\n\n---\n\n### 3.10 見た目の上書き（仕様 1.9、アプリ 1.3.0）\n\n利用者は、HTML と同じフォルダに `mdfolio.css` を置くことで、本文と画面の見た目を変えられる。プログラムを書き換えたり、コマンドを実行したりする必要はない。\n\n| ID | 優先度 | 要件 |\n|---|---|---|\n| FR-1001 | 必須 | ビューア（`mdfolio.html`）と書き出したサイトの HTML は、同じフォルダの `mdfolio.css`（相対パス `mdfolio.css`）を読み込み、内蔵の CSS のあとに適用する（同じ指定なら `mdfolio.css` が勝つ）。ファイルがなければ内蔵の CSS だけで表示し、利用者に何も表示しない |\n| FR-1002 | 必須 | 書き出しの画面に「CSS を選ぶ」を置く。選んだ CSS ファイルを、書き出す HTML の中に埋め込む（`\u003cstyle id=\"mdv-user-style\">`。内蔵の CSS のあと、`mdfolio.css` の前）。選んだものは取り消せる |\n| FR-1003 | 必須 | 書き出しの画面には、埋め込む CSS の状態を示す: 選んだファイル名／今の HTML にすでに埋め込まれている CSS を引き継ぐ／なし。今の HTML に埋め込まれた CSS は、既定で引き継ぐ |\n| FR-1004 | 必須 | ページを `http(s)://` で開いていて、隣の `mdfolio.css` の中身を読める場合（同じサーバー）は、選ばなくてもそれを埋め込みの候補にする。`file://` で開いた場合は中身を読めない（ブラウザーの制約。8.6）ので、隣の CSS が効いていれば「書き出しには入らない。入れるには同じファイルを選ぶ」と表示する |\n| FR-1005 | 必須 | 選べる CSS は 1MB まで。UTF-8（BOM は取り除く）として読む。`\u003c/style` を含むものは埋め込めないので、理由を示して受け付けない |\n| FR-1006 | 必須 | コマンドライン版の書き出し（FR-604）に `--css \u003cファイル>` を加え、同じように埋め込めるようにする |\n| FR-1007 | 必須 | 図（Mermaid）の配色は、`mdfolio.css` と埋め込んだ CSS で変えた配色の変数も反映する（CSS の変数から図の色を取る。1.1.0 で導入） |\n\n#### 安全面\n\n- CSP の `style-src` に `'self' file:` を加える（隣の CSS を読むため）。スクリプトの許可（SEC-4）は変えない。CSS はスクリプトを実行できない。\n- 文書（Markdown）の中の `\u003clink>` や `\u003cstyle>` はサニタイズで取り除くので、文書が別の CSS を読み込ませることはできない。\n- `mdfolio.css` の `url()` に外部のアドレスを書いても、外部の画像を許可していない間は CSP（SEC-10）で読み込まれない。\n- `http(s)://` で開いた場合、隣の `mdfolio.css` を同じサーバーへ取りに行く（1 回）。ページそのものと同じ配信元なので、新たに外部へ知らせる情報はない。ファイルがなければ、ブラウザーの開発者向けの表示に「見つからない」と出るが、動作には影響しない。\n\n## 4. 画面仕様\n\n### 4.1 レイアウト\n\n```\n┌────────────────────────────────────────────────────────────────────┐\n│ [≡] サイトタイトル        [ 検索  Ctrl+K ]            [テーマ] [⋯] │ ヘッダー（固定）\n├──────────────┬───────────────────────────────────┬─────────────────┤\n│ サイドバー   │ guide / intro.md   更新 2026-11-12 │ このページの目次│\n│ （ツリー／   │ # タイトル                          │  ・見出し       │\n│   ナビ）     │ 本文（最大幅 約 820px）             │  ・見出し       │\n└──────────────┴───────────────────────────────────┴─────────────────┘\n```\n\n| 画面幅 | レイアウト |\n|---|---|\n| 1200px 以上 | サイドバー ＋ 本文 ＋ 目次 |\n| 800〜1199px | サイドバー ＋ 本文（目次は本文先頭の折りたたみに移動） |\n| 800px 未満 | 本文のみ（目次は本文先頭の折りたたみ）。サイドバーは `≡` で開くドロワー |\n\n### 4.2 画面・部品\n\n| 部品 | 内容 |\n|---|---|\n| 開始画面 | 閲覧モードで文書セット未読込のときに表示。ドロップ領域、「フォルダを開く」「ファイルを開く」ボタン、（あれば）「前回のフォルダを開く」、使い方へのリンク。説明文は、ファイルが端末の中だけで処理されることを伝える。指で操作する端末ではドロップの案内を省く。お試し用の公開ページ（`hosted: true`）では、「外部には送信されません」とは書かず、動作確認用の公開ページであることと、機密の文書は手元の配布版で開くことを伝える |\n| ヘッダー | サイドバー開閉、サイトタイトル（クリックでホーム）、検索欄、テーマ切替、メニュー |\n| メニュー（⋯） | フォルダを開く／ファイルを開く／再読み込み／サイトとして書き出し／外部画像の許可／言語／使い方／ライセンス・バージョン情報。サイトモードでは「開く」「再読み込み」「書き出し」を表示しない。設定で使わないようにした操作（`allowDownloads: false` の「書き出し」、`lockExternalImages: true` の「外部画像の許可」）も表示しない |\n| サイドバー | ファイルツリー。カスタムナビがある場合は「ナビ／ファイル」タブ。表示中の文書は、本文の紙面と地続きのタブとして示す |\n| 本文 | パス・更新日時、レンダリング結果 |\n| 目次 | H1〜H4。現在位置を強調 |\n| 検索パネル | 検索欄の下に重ねて表示。結果一覧、件数、索引作成の進捗 |\n| 書き出しダイアログ | サイトタイトル、ホーム文書、文書数・添付数・概算サイズ、実行／キャンセル |\n| 外部画像の確認ダイアログ | 外部の画像を表示する側へ切り替えるときに表示。接続先が増えること、再読み込みすること（閲覧モードではフォルダが閉じること）を伝える。実行／キャンセル |\n| ライセンスダイアログ | バージョン、ライセンス表記全文 |\n| 通知 | 画面下部に一時表示（読み上げ対応） |\n\n### 4.3 キーボード操作\n\n| キー | 動作 |\n|---|---|\n| `Ctrl+K` / `⌘K` / `/` | 検索欄にフォーカス（入力欄にフォーカスがあるときの `/` は通常の文字入力） |\n| `↑` `↓` `Enter` | 検索結果の選択・決定 |\n| `Esc` | 検索パネル・メニュー・ドロワー・ダイアログを閉じる |\n| `Tab` | ページ先頭の最初の移動先は「本文へ移動」。以降はヘッダー → サイドバー → 本文 → 目次の順 |\n| メニュー: `Enter` / `↓` で開く、`↑` `↓` `Home` `End` で項目を移動、`Esc` / `Tab` で閉じる | 閉じたとき・項目を選んだあとは、フォーカスをメニューのボタンへ戻す |\n| サイドバーのタブ: `←` `→` `Home` `End` | 「ナビ／ファイル」を切り替える |\n| 横にはみ出した表・コード: フォーカスして `←` `→` | その要素を横にスクロールする |\n\n---\n\n## 5. データ仕様\n\n### 5.1 パスの正規化\n\n- 文書セット内のパスは、ルートからの相対パス（区切りは `/`、先頭に `/` なし）で表す。例: `guide/intro.md`\n- 照合用のキーは Unicode 正規化（NFC）する。\n- フォルダを開いた場合、選択したフォルダ自体がルートになる（フォルダ名はサイトタイトルの既定値に使う）。\n\n### 5.2 ルート（URL ハッシュ）\n\n| 形式 | 意味 |\n|---|---|\n| （空）または `#/` | ホーム文書 |\n| `#/\u003cパス>` | 文書。各パス要素は `encodeURIComponent` でエンコードする。例: `#/guide/%E5%B0%8E%E5%85%A5.md` |\n| `#/\u003cパス>#\u003c見出しID>` | 文書内の見出し位置。見出し ID は `encodeURIComponent` でエンコードする |\n| `#!help` | ヘルプ |\n\n- URL 上の見出し ID には接頭辞を付けない（例: `#/a.md#概要`）。DOM 上の実際の `id` は `user-content-概要` とし（SEC-2）、アプリが対応づける。\n- 見出し ID の照合は、完全一致 → デコード後の一致 → 小文字化して一致 → スラッグ化して一致 の順で行う。\n\n### 5.3 リンク・画像パスの解決\n\n文書中の `href` / `src` は次の順で解決する。\n\n1. `#` で始まる → 同一文書内の見出し。\n2. スキーム（`http:` `https:` `mailto:` 等）付き、または `//` で始まる → 外部。\n3. それ以外は文書セット内のパスとして解決する。\n   1. `#` 以降（フラグメント）と `?` 以降を分離する。\n   2. パーセントエンコードをデコードし（失敗時は元の文字列のまま）、`\\` を `/` に置換する。\n   3. `/` で始まる場合はルート基準、それ以外は現在の文書のフォルダ基準で `.` `..` を解決する。ルートより上に出る場合は「解決不能」。\n   4. 次の順で照合する: 完全一致 → 大文字小文字を無視して一致 → 拡張子がない場合は `.md` を補って一致 → 拡張子が `.html` / `.htm` の場合は `.md` に読み替えて一致 → フォルダを指す場合は配下の `README.md` / `index.md`。\n4. 結果:\n   - 文書に解決できた → `#/\u003cパス>[#フラグメント]` へのリンクにする。\n   - 添付に解決できた → 画像・メディアはその内容を表示、リンクはダウンロード。\n   - 解決できない → 画像はプレースホルダ、リンクは「見つかりません」ページへのリンクにする。\n- `file:` で始まる URL や Windows の絶対パス（`C:\\...`）はサニタイズで無効化され、リンクとして機能しない（11 章）。\n\n### 5.4 設定ブロック\n\nHTML 内の `\u003cscript type=\"application/json\" id=\"mdv-config\">` に JSON で記述する。手作業で編集してよい（CSP の対象外）。\n\n| キー | 型 | 既定 | 意味 |\n|---|---|---|---|\n| `title` | string | `\"\"` | サイトタイトル（空ならフォルダ名、なければ `mdfolio`） |\n| `lang` | `\"auto\"`/`\"ja\"`/`\"en\"` | `\"auto\"` | UI 言語の既定 |\n| `theme` | `\"auto\"`/`\"light\"`/`\"dark\"` | `\"auto\"` | テーマの既定 |\n| `home` | string | `\"\"` | ホーム文書のパス |\n| `allowExternalImages` | boolean | `false` | 外部画像・メディアの既定許可 |\n| `allowDownloads` | boolean | `true` | `false` にすると、ファイルの保存を伴う操作（サイトとして書き出し、添付の保存）を画面に出さない。添付へのリンクは、保存できない旨の表示になる |\n| `lockExternalImages` | boolean | `false` | `true` にすると、外部の画像・メディアを常に読み込まない。切り替えの項目を出さず、利用者が保存した設定や `allowExternalImages` より優先する |\n| `hosted` | boolean | `false` | `true` にすると、お試し用の公開ページであることを開始画面と使い方に表示する（6.1）。アプリ内の書き出しで作った HTML には引き継がない |\n\n利用者がブラウザ上で変更した設定（5.6）がある場合はそちらを優先する（`lockExternalImages` を除く）。JSON が壊れている場合は既定値で動作する。`allowDownloads` と `lockExternalImages` は `true` / `false` がはっきり書かれたときだけ既定から変わる。\n\n`allowDownloads` / `lockExternalImages` は、ファイルの保存や外部の読み込みができない環境（2.1）に置く場合や、配布先でそれらを使わせたくない場合に使う。\n\n### 5.5 サイトデータ（埋め込み形式）\n\nHTML 内の `\u003cscript type=\"application/json\" id=\"mdv-site\">` に JSON で格納する。未埋め込み時は `null`。\n\n```json\n{\n  \"format\": 1,\n  \"generator\": \"mdfolio 1.0.1\",\n  \"created\": \"2026-11-13T01:00:00.000Z\",\n  \"name\": \"docs\",\n  \"files\": [\n    { \"path\": \"README.md\", \"kind\": \"doc\", \"mtime\": 1794000000000, \"text\": \"# ...\" },\n    { \"path\": \"img/a.png\", \"kind\": \"asset\", \"mime\": \"image/png\", \"mtime\": 1794000000000, \"base64\": \"iVBORw0...\" }\n  ]\n}\n```\n\n- JSON 文字列中の `\u003c` は `\\u003c` にエスケープして格納する（HTML パーサーによる誤解釈の防止）。\n- `format` が未対応の値の場合や、`files` の各要素が決まりどおりでない場合（`kind` が `doc` / `asset` 以外、`text` / `base64` / `mime` が文字列でない、`mtime` が数値でない等）は、読み込まずエラーを通知する。\n- `path` は 5.1 の規則で正規化する。`..` でルートより上を指すパスの要素は読み込まない。パスは埋め込みデータの中の名前としてだけ使い、ディスク上のファイルは読まない。\n- サイトタイトル・ホーム文書は設定ブロック（5.4）に格納する。\n\n### 5.6 ブラウザに保存するデータ\n\n| 保存先 | キー | 内容 |\n|---|---|---|\n| localStorage | `mdv:settings:v1` | テーマ・言語・外部画像許可・サイドバー開閉 |\n| IndexedDB（DB 名 `mdv`） | `last:\u003cHTML ファイルのパス>` | 前回開いたフォルダのハンドルと名前 |\n\n文書の内容そのものはブラウザに保存しない。`file://` ではブラウザによって保存領域がローカルの他の HTML と共有されるため、保存するのは上記の表示設定とフォルダハンドルに限る。\n\n---\n\n## 6. セキュリティ・プライバシー\n\n想定する脅威: 第三者が作成した Markdown を開いたときに、文書に仕込まれたスクリプトが実行され、開いているフォルダの内容が外部へ送信されること。\n\n| ID | 要件 |\n|---|---|\n| SEC-1 | レンダリング結果の HTML は DOMPurify でサニタイズしてから DOM に挿入する。`\u003cscript>` `\u003cstyle>` `\u003ciframe>` `\u003cobject>` `\u003cembed>` `\u003cform>` と入力部品、インライン SVG / MathML、イベントハンドラ属性、`javascript:` / `data:` / `file:` のリンクを除去する（チェックボックス表示用の `input` のみ、操作不可にして許可する）。コードの色分け結果（FR-204）も同じくサニタイザーを通す |\n| SEC-2 | 利用者 HTML の `id` / `name` には接頭辞 `user-content-` を付け、アプリ自身の要素との衝突（DOM clobbering）を防ぐ。アプリ内部用のクラス名（`mdv-` で始まるもの）と `data-*` 属性は利用者 HTML から除去する |\n| SEC-3 | `style` 属性は、許可するプロパティ（文字色・背景色・文字装飾・揃え・余白・枠線・サイズ等）をホワイトリストで限定する。`url()` 等の外部参照を含む値と、位置指定・重なり・変形に関するプロパティ（`position` `z-index` `transform` 等）は除去する。表の列揃え（`text-align`）はこの範囲で動作する |\n| SEC-4 | Content-Security-Policy を `\u003cmeta>` で設定する。`script-src` は内蔵スクリプトの SHA-256 ハッシュのみを許可し（`unsafe-inline` / `unsafe-eval` なし）、`connect-src 'none'` とする。これにより、万一サニタイズをすり抜けても注入スクリプトは実行されない |\n| SEC-5 | アプリは通信 API（`fetch` / `XMLHttpRequest` / `WebSocket` / `sendBeacon`）を使わない。外部へのリクエストが発生し得るのは、利用者が外部画像を許可した場合の画像・メディア取得（図の中で指定された画像を含む）と、利用者が外部リンクをクリックした場合のみ |\n| SEC-6 | 数式は KaTeX の `trust: false`、図は Mermaid の `securityLevel: 'strict'` で描画する |\n| SEC-7 | 外部リンクには `rel=\"noopener noreferrer\"` を付ける |\n| SEC-8 | 解析・テレメトリ等の送信機能を持たない |\n| SEC-9 | 添付ファイルへのリンクは常にダウンロードとして扱い、アプリと同じオリジンで HTML 等として開かない。SVG 画像は `\u003cimg>` としてのみ表示する（インライン展開しない） |\n| SEC-10 | 外部の画像・メディアを許可していない間は、起動時（文書を表示する前）に `img-src data: blob:; media-src data: blob:` という CSP を `\u003cmeta>` で追加し、ブラウザ自身にも読み込みを止めさせる。表示処理での除去（FR-210）だけでは、図（Mermaid）の画像ノード・ラベル内の `\u003cimg>`・`themeCSS` の `url()` のような別経路からの読み込みを防げないため。CSP は厳しくする方向にしか変えられないので、許可へ切り替えるにはページの再読み込みが必要になる |\n\nCSP（ハッシュはビルド時に埋め込む）:\n\n```\ndefault-src 'none'; script-src 'sha256-…' …; style-src 'unsafe-inline';\nimg-src data: blob: http: https:; media-src data: blob: http: https:; font-src data:;\nconnect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none';\nform-action 'none'; base-uri 'none'\n```\n\n- `img-src` / `media-src` に `http: https:` を含めるのは「外部画像を許可」設定のため。既定のブロックは、アプリ層（サニタイズ後の `src` 書き換え）と、起動時に追加する CSP（SEC-10）の二重で行う。\n- `file:` はどの指定にも含めない。`file://` で開いた場合でも、文書からローカルの別ファイルや共有フォルダー（UNC パス）を画像として読み込ませることはできない。\n- 悪意のある文書を表示したとき、CSP が読み込みを止めた記録（違反メッセージ）がブラウザーの開発者ツールのコンソールに出ることがある。これは遮断が働いた結果であり、異常ではない。\n- スクリプトのハッシュは HTML 内のスクリプト本文に対応する。スクリプト部分を手作業で書き換えると動作しなくなる（設定ブロックとサイトデータは編集してよい）。\n\n### 6.1 外部のホスティング環境に置く場合（お試し用の変換）\n\nページをサンドボックス化したフレームの中で表示し、ページの中へ独自のスクリプトを差し込む種類のホスティング環境では、SEC-4 の CSP がそのスクリプトを止めてしまうため、そのままでは置けない。`tools/dev/make-hosted.mjs` は、次の変換を行った HTML を作る。\n\n1. HTML に書いてある CSP（SEC-4）を取り除く。\n2. 設定を `allowDownloads: false`、`lockExternalImages: true`、`hosted: true` にする。\n3. 置換文字（U+FFFD）を、同じ意味のエスケープ（スクリプトでは `\\uFFFD`、JSON では `\\ufffd`）に書き換える。この文字は「文字コードの変換に失敗した印」でもあり、含まれているだけでファイルを受け付けないホスティング環境があるため。同梱ライブラリ（markdown-it）は、不正な入力をこの文字に置き換える処理の中でこの文字そのものを使っており、文書のデータに含まれることもある。スクリプトでは「置換文字だけでできた文字列」に限って書き換え、それ以外の場所にある場合は変換をやめる（意味を変えない書き換えだと言い切れないため）。\n\n変換後の HTML は、この仕様の安全上の保証の一部を持たない。\n\n- SEC-4（スクリプトをハッシュで限定する）と `connect-src 'none'` は、HTML 自身では強制されない。外部との通信の遮断は、ホスティング側の CSP に依存する。\n- SEC-1〜3（サニタイズ）、SEC-6、SEC-7、SEC-9、SEC-10（外部の画像を読み込ませない CSP の追加）は変わらず働く。\n- ホスティング側がページに差し込むスクリプトの動作は、このソフトウェアからは制御できない。このため開始画面では「外部には送信されません」と表示せず、機密の文書は手元の配布版で開くよう案内する（4.2）。\n\n変換後の HTML は、動作確認やサンプルの公開のためのものとし、手元で開く・組織内で配布する用途には変換前の HTML を使う。\n\n---\n\n## 7. 非機能要件\n\n| ID | 区分 | 要件 |\n|---|---|---|\n| NFR-1 | 配布性 | 成果物は単一の HTML ファイル。外部ファイルへの依存なし |\n| NFR-2 | 性能 | 起動から開始画面表示まで 1 秒以内。1MB の文書を 3 秒以内に表示（コードの色分けのうち FR-204 で後回しにする分は含めない）。1,000 文書のフォルダで、ツリー表示 2 秒以内・索引作成 10 秒以内・検索応答 0.3 秒以内（参考: 2 コア程度の PC） |\n| NFR-3 | サイズ | ビューア本体 6MB 以下 |\n| NFR-4 | アクセシビリティ | 主要操作をキーボードのみで行える（4.3）。ボタン・入力欄・チェックボックス・検索結果の一覧に名前を付ける。画面上の文字と背景のコントラスト比 4.5:1 以上（ライト・ダーク・印刷）。フォーカスの位置が見える。`prefers-reduced-motion` を尊重する。文書を切り替えたときは本文領域にフォーカスを移す。ダイアログを閉じたときは、開く前の位置へフォーカスを戻す。文書の作者が `style` で指定した色は調整しない |\n| NFR-5 | 国際化 | UI は日本語・英語。文書・ファイル名は日本語を含む Unicode を扱える |\n| NFR-6 | 保守性 | ビルドは Node.js 標準機能のみで実行できる（npm パッケージ不要）。同梱ライブラリは `vendor/` に配布物そのままの形で置き、名称・版・ライセンス・SHA-256 を一覧化する。ライブラリ更新時は、許可ライセンス一覧にないライセンスを検出したら処理を止める |\n| NFR-7 | 堅牢性 | 保存領域（localStorage / IndexedDB）が使えない環境でも閲覧機能は動作する |\n\n---\n\n## 8. 構成\n\n### 8.1 成果物\n\n| ファイル | 内容 |\n|---|---|\n| `dist/mdfolio.html` | ビューア本体（単一 HTML）。これだけを配布すれば動く |\n| `sample-docs/` | 動作確認用のサンプル文書（フォルダ） |\n| `sample-docs-en/` | 同じ内容の英語のサンプル文書（8.7） |\n| `sample.md` `sample.en.md` | 動作確認用のサンプル文書（1 ファイルで完結するもの。日本語と英語） |\n| `CHANGELOG.md` | 変更履歴（日本語だけ） |\n| `src/` `vendor/` `tools/` `tests/` | ソース、同梱ライブラリ、ビルド・書き出しツール、テスト |\n| `docs/` | 仕様書・レビュー記録・テスト報告書 |\n| `README.md`（英語）`README.ja.md`（日本語）`LICENSE` `THIRD-PARTY-NOTICES.txt` | 使い方、ライセンス |\n\n### 8.2 HTML の内部構造\n\n```html\n\u003c!DOCTYPE html>\n\u003chtml lang=\"ja\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"…\">\n  \u003cmeta name=\"referrer\" content=\"no-referrer\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003cmeta name=\"generator\" content=\"mdfolio 1.0.1\">\n  \u003clink rel=\"icon\" href=\"data:image/svg+xml,…\">                          \u003c!-- タブのアイコン（HTML の中に持つ） -->\n  \u003ctitle>…\u003c/title>\n  \u003cstyle id=\"mdv-style\">/* アプリの CSS */\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cnoscript>…\u003c/noscript>\n  \u003cdiv id=\"mdv-root\">\u003c/div>\n  \u003cscript type=\"application/json\" id=\"mdv-config\">{…}\u003c/script>\n  \u003cscript type=\"application/json\" id=\"mdv-site\">null\u003c/script>\n  \u003cscript type=\"application/json\" id=\"mdv-res-help-ja\">\"…\"\u003c/script>      \u003c!-- ヘルプ（Markdown） -->\n  \u003cscript type=\"application/json\" id=\"mdv-res-help-en\">\"…\"\u003c/script>\n  \u003cscript type=\"application/json\" id=\"mdv-res-licenses\">\"…\"\u003c/script>     \u003c!-- ライセンス表記全文 -->\n  \u003cscript type=\"application/json\" id=\"mdv-res-katex-css\">\"…\"\u003c/script>    \u003c!-- KaTeX の CSS（フォント内蔵） -->\n  \u003cscript type=\"application/json\" id=\"mdv-lib-katex\">\"…\"\u003c/script>        \u003c!-- 遅延読込ライブラリ（文字列として格納） -->\n  \u003cscript type=\"application/json\" id=\"mdv-lib-mermaid\">\"…\"\u003c/script>\n  \u003cscript id=\"mdv-js-vendor\">/* markdown-it, markdown-it-footnote, DOMPurify, highlight.js */\u003c/script>\n  \u003cscript id=\"mdv-js-app\">/* アプリ本体（core, md, i18n, app） */\u003c/script>\n\u003c/body>\n\u003c/html>\n```\n\n- **常時読み込むライブラリ**（markdown-it、DOMPurify、highlight.js、アプリ本体）は通常のインラインスクリプトとして格納する（CSP ハッシュの最も標準的な使い方であり、ブラウザ間の差が出にくい）。\n- **遅延読み込みするライブラリ**（KaTeX、Mermaid）は JSON 文字列として格納し、数式／図を含む文書を初めて表示するときに `\u003cscript>` 要素を生成して実行する（起動を軽くするため）。この動的スクリプトも CSP のハッシュ照合を受け、ハッシュは `vendor/` の配布ファイルそのものの SHA-256 と一致する。実行できなかった場合は FR-205 / FR-206 の代替表示になる。\n- タブのアイコンを `data:` URL で HTML の中に持つ。http(s) で配信した場合に、ブラウザーが `favicon.ico` を取りに行かないようにするため（HTML 以外の通信を発生させない）。\n- CSP の `script-src` には、ハッシュを「常時読み込む 2 つ → KaTeX → Mermaid」の順に並べる。サイト書き出しでライブラリを除外するとき、この並びを手がかりに対応するハッシュを外す（FR-603）。\n- 外部の画像を許可していない間は、起動時にスクリプトが `\u003cmeta http-equiv=\"Content-Security-Policy\">` をもう 1 つ追加する（SEC-10）。書き出しには含めない。\n- 画面の DOM はすべてスクリプトが `#mdv-root` 配下に生成する。\n- `id` が `mdv-` で始まるブロックの本文は、起動後に書き換えない（書き出し時にそのまま再利用するため）。\n\n### 8.3 ソース構成\n\n| パス | 役割 |\n|---|---|\n| `src/core.js` | DOM に依存しない処理（パス解決、ルート、スラッグ、検索、フロントマター、文字コード判定、ツリー構築、サイトデータ、HTML 組み立て） |\n| `src/md.js` | markdown-it の設定と拡張（タスクリスト、アラート、数式、Mermaid、見出し ID、参照抽出） |\n| `src/i18n.js` | UI 文言（日本語・英語） |\n| `src/app.js` | 画面・操作（読み込み、描画、ナビ、検索 UI、書き出し） |\n| `src/app.css` | スタイル |\n| `src/help.ja.md` `src/help.en.md` | ヘルプ文書 |\n| `tools/build.mjs` | ビルド（`dist/mdfolio.html` を生成） |\n| `tools/build-site.mjs` | サイト HTML 書き出し CLI |\n| `tools/vendor.mjs` | 同梱ライブラリの更新とライセンス表記の生成（保守者向け。これだけは npm を使う） |\n| `tools/dev/make-hosted.mjs` | 外部のホスティング環境に置くための変換（6.1） |\n| `tools/dev/make-pages.mjs` | GitHub Pages に置く一式（案内のページ、ビューア、書き出しの見本、見た目の見本、説明書。日本語と英語）を作る（8.7） |\n| `tools/dev/make-release.mjs` | 配布用の zip とリリースの説明を作る（8.8） |\n| `.github/workflows/` | 公開ページの更新とリリースの自動実行（8.8） |\n| `tools/dev/make-zip.py` | 配布用の zip を作る。日本語のファイル名に UTF-8 の印を付ける（付けないと、Windows で展開したときにファイル名が文字化けし、文書間のリンクが切れる） |\n\n`core.js` と `md.js` はブラウザと Node.js の両方で読み込める形にし、単体テストと CLI から同じコードを使う。\n\n### 8.4 同梱ライブラリ\n\n| ライブラリ | 用途 | ライセンス |\n|---|---|---|\n| markdown-it | Markdown パーサー | MIT |\n| markdown-it-footnote | 脚注 | MIT |\n| DOMPurify | HTML サニタイズ | Apache-2.0（MPL-2.0 とのデュアル。Apache-2.0 を選択） |\n| highlight.js | シンタックスハイライト | BSD-3-Clause |\n| KaTeX（フォント含む） | 数式 | MIT |\n| Mermaid（軽量版 `@mermaid-js/tiny`） | 図 | MIT |\n\n- 版は実装時点の npm 最新安定版を採用し、`vendor/manifest.json` に記録する。\n- Mermaid は完全版ではなく軽量版を採用する。完全版には `elkjs`（EPL-2.0 または GPL-3.0-or-later）が同梱されており再配布時の義務が増えること、および軽量版のほうがサイズが約半分であることによる（レビュー RV-06 で実物を確認）。\n- 各ライブラリが内部に取り込んでいる依存ライブラリのライセンス表記も、ライセンス表記全文に含める。\n- テストでだけ使うもの（Playwright、axe-core）は成果物に含めない。\n\n### 8.5 ビルド\n\n`node tools/build.mjs` で `src/` と `vendor/` から `dist/mdfolio.html` を生成する。ビルドは次を行う。\n\n1. CSS・スクリプト・リソースを 8.2 の構造に組み立てる。\n2. 通常のインラインスクリプトについて、末尾の `sourceMappingURL` コメントを除去し、本文に含まれる `\u003c!--` `\u003cscript` `\u003c/script` の `\u003c` を、意味を変えないエスケープ（`\\x3c`）に置換する。\n3. 各スクリプトの SHA-256 を計算し、CSP に埋め込む。\n4. 出力を検証する（置換後スクリプトの構文チェック、改行コードが LF のみであること、各ブロック本文に `\u003c/script` が現れないこと、サイズ）。\n5. `dist/mdfolio.manifest.json` に、成果物のサイズ・SHA-256・CSP・各ブロックのサイズとハッシュを記録する。\n\n`--without mermaid,katex` を付けると、数式・図のライブラリを含めない軽量版を作れる（約 0.6MB）。同じ入力からは常に同じ出力になる。\n\n---\n\n### 8.6 フォルダ版（アプリ 1.1.0 で追加、1.3.0 で廃止）\n\n1.1.0〜1.2.0 にあった「フォルダ版」（`index.html` と `style/`・`docs/`・`lib/`・`data/` のフォルダ、更新コマンド `tools/update.mjs`）は、1.3.0 で廃止した。見た目を変える目的は、単一 HTML の隣に置く `mdfolio.css`（3.10）で置き換える。\n\n廃止の理由（依頼者と合意）:\n\n- 文書や CSS を変えるたびに更新コマンドが必要で、管理する人のパソコンに Node.js が要った。\n- 単一 HTML と 2 つの形を保つと、説明・テスト・公開の手間が倍になる。\n\n残る制約（ブラウザーの決まり）: `file://` で開いたページは、隣のファイルを使う（CSS を効かせる、画像を表示する）ことはできるが、中身を文字として読み取れない。このため隣の `mdfolio.css` は画面に効くが、書き出しには自動では入らない（FR-1004）。フォルダ版では、更新コマンドが CSS の写しを JavaScript のファイルに作ることで、この制約を避けていた。\n\n### 8.7 公開ページと英語の文書（仕様 1.5 で追加）\n\nGitHub Pages の公開ページ（https://particlepudding.github.io/mdfolio/）と、利用者が読む文書を、日本語と英語の両方で用意する。アプリの画面の言語の切り替え（FR-501 など）はこれまでどおりで、ここではアプリの外側の文書と公開ページを扱う。\n\n#### 構成\n\n```\n（公開ページ）\n  index.html              案内（日本語）\n  sample-site.html        書き出しの見本（sample-docs/。画面は日本語）\n  style/                  見た目の見本（書き出しの見本と、隣に置いた mdfolio.css）\n  mdfolio-docs.html       説明書（README.ja.md と、仕様書・レビュー記録・テスト報告書）\n  mdfolio.html            ビューア（1 つだけ。画面の言語はブラウザーに合わせる）\n  en/\n    index.html            案内（英語）\n    sample-site.html      書き出しの見本（sample-docs-en/。画面は英語）\n    style/                見た目の見本（英語）\n    mdfolio-docs.html     説明書（README.md）\n```\n\nリポジトリには、英語の見本文書 `sample-docs-en/` を置く。README は、英語を `README.md`、日本語を `README.ja.md` とする（仕様 1.11。GitHub のリポジトリの画面で最初に英語が出るように）。\n\n#### 要件\n\n| ID | 優先度 | 内容 |\n|---|---|---|\n| PG-1 | 必須 | 公開ページの案内・書き出しの見本・見た目の見本・説明書を、日本語と英語の両方で用意する。英語は `en/` の下に置く。ビューアは 1 つで、両方の案内から同じものを開く |\n| PG-2 | 必須 | 案内のページの上部に、もう一方の言語の案内へのリンクを置く。両方の案内に、互いを指す `hreflang` の指定を書く。言語による自動の振り分け（スクリプトでの転送）はしない |\n| PG-3 | 必須 | 公開ページの見本（書き出し・見た目）と説明書は、画面の言語を文書の言語に合わせて固定する（設定 `lang` を `ja` / `en`）。利用者がメニューで切り替えた場合はそれに従う（5.6）。リポジトリの `dist/` にある見本（`sample-site.html`）は `auto` のまま変えない。説明書（`dist/mdfolio-docs.html`）は公開ページと同じものなので `ja` に固定する |\n| PG-4 | 必須 | `sample-docs-en/` は、`sample-docs/` と同じ構成（文書の数、サイドバー、画像、添付）と、同じ機能の見本（リンク、検索、表、アラート、コード、数式、図、脚注、折りたたみ、フロントマター）を持つ。ファイル名とフォルダ名は英語にする。日本語に固有の見本（全角の検索語など）は、英語で意味のある見本に置き換える |\n| PG-5 | 必須 | 英語の文書で画面の部品の名前を書くときは、アプリの英語の表示（`src/i18n.js` の `en`）と同じ言葉を使う |\n| PG-6 | 必須 | `README.md`（英語）と `README.ja.md`（日本語）の先頭に、互いへのリンクを置く。英語の説明書には、仕様書・レビュー記録・テスト報告書が日本語だけであることを書く |\n| PG-7 | 必須 | 案内のページはスクリプトを使わず、外部と通信しない（CSP で `default-src 'none'`）。ほかのページは、配布物と同じ安全の仕組みのままにする |\n| PG-8 | 必須 | 見本文書（日本語・英語）の中の相対リンクと画像は、すべて実在するファイルを指す。単体テストで確かめる |\n| PG-9 | 必須 | 公開ページのすべての HTML は、`LICENSE` と `THIRD-PARTY-NOTICES.txt` の全文を含む。アプリの HTML は従来どおり埋め込み（FR-802）、案内のページは折りたたみの欄に全文を載せる（スクリプトなしで読める）。単体テストで確かめる |\n\n### 8.8 公開ページとリリースの自動化（仕様 1.7 で追加）\n\nGitHub の自動実行の仕組み（GitHub Actions）で、公開ページの更新とリリースの作成を行う。設定ファイルは `.github/workflows/` に置く。\n\n| ID | 優先度 | 内容 |\n|---|---|---|\n| AU-1 | 必須 | `main` が更新されたら、単体テスト → ビルド → 公開用の一式の組み立て（`make-pages.mjs`）を行い、`gh-pages` ブランチを置き換える。どれかが失敗したら公開ページは変えない |\n| AU-2 | 必須 | `v` で始まるタグ（例: `v1.2.0`）が付いたとき、または GitHub の Actions の画面から手で始めたとき（`main` の最新に `v\u003cpackage.json の版>` のタグを作る。同じ版のリリースがすでにあれば止める）、タグの版が `package.json` の版と一致することを確かめ、単体テストとビルドのあと、GitHub のリリースを作る。リリースの説明には変更履歴（`CHANGELOG.md`）のその版の部分を使う |\n| AU-3 | 必須 | リリースに添付するファイルは、`mdfolio.html`（単一 HTML 版。これ 1 つで動く）と、配布用の zip `mdfolio-\u003c版>.zip` の 2 つ。zip の中身は、単一 HTML 版、見た目の見本の CSS（`examples/mdfolio.css`）、見本（`sample-docs/`、`sample-docs-en/`、`sample.md`、`sample.en.md`）、`README.md`、`README.en.md`、`CHANGELOG.md`、`LICENSE`、`THIRD-PARTY-NOTICES.txt`。日本語のファイル名に UTF-8 の印を付ける（`make-zip.py`） |\n| AU-4 | 必須 | 自動実行で使う権限は、`gh-pages` ブランチへの書き込みとリリースの作成に必要な範囲（`contents: write`）だけにする。外部のサービスの部品（第三者のアクション）は、GitHub 公式のもの（`actions/checkout`、`actions/setup-node`）だけを使う |\n| AU-5 | 必須 | 配布用の zip と、リリースの説明の組み立ては `tools/dev/make-release.mjs` で行い、手元でも同じものを作れるようにする |\n\n## 9. ライセンス方針\n\n- 自作部分は MIT License とする（著作権者名は利用者が記入する）。\n- 同梱する第三者ソフトウェアは、再配布が許諾されている寛容型ライセンス（MIT / ISC / BSD / Apache-2.0 / Unlicense / OFL 等）のものに限る。GPL・EPL 等のコピーレフト系ライセンスのコードは同梱しない。\n- 本ソフトウェアと第三者ソフトウェアのライセンス表記全文を **HTML 内に内蔵**する（FR-802）。これにより、単一 HTML を再配布するだけで著作権表示・許諾表示の同梱義務を満たせる。\n- 書き出したサイト HTML にも同じ表記が含まれる（FR-603 でライブラリを除外した場合も表記は残す）。\n\n---\n\n## 10. テスト方針\n\n| レベル | 対象 | 方法 |\n|---|---|---|\n| 単体テスト | `core.js` `md.js` の各関数、ビルド成果物の検証、CLI | Node.js 標準のテストランナー（`node --test`） |\n| 結合・E2E テスト | ビルドした `dist/mdfolio.html` の全機能 | Playwright で実ブラウザ（Chromium）を自動操作。主に `file://` で実行する |\n| セキュリティテスト | XSS 文書、CSP、外部通信の有無 | E2E 内で検証。「通信していない」ことは、外部サーバーの代わりに用意したローカルの HTTP サーバーに届いたリクエストの有無で判定する（ブラウザー側の記録だけに頼らない） |\n| アクセシビリティテスト | NFR-4 の各項目 | 独立した検査エンジン（axe-core）による自動検査と、キーボード操作・フォーカス・配色の個別確認 |\n| 別エンジンでの確認 | Gecko（Firefox のエンジン）、WebKit（Safari 系のエンジン） | WebDriver で実ブラウザーを操作し、主要機能を確認する（`tests/cross/`）。通常の `npm test` には含めない |\n| 埋め込み表示のテスト | 2.1 の各条件、6.1 の変換後の HTML | E2E 内で、別オリジンのサンドボックス化したフレーム（ホスティング環境を模したもの）と `srcdoc` のフレームに入れて検証する。Gecko / WebKit でも同じ 2 種類のフレームで確認する |\n| 性能テスト | NFR-2 の各項目 | E2E 内で計測 |\n| 目視確認 | 画面デザイン（ライト／ダーク、広幅／狭幅） | スクリーンショットを確認 |\n\nテスト環境と代替手段:\n\n- ブラウザのネイティブなフォルダ選択ダイアログは自動操作できない。`showDirectoryPicker` 経路は、`file://` ではテスト用の差し替えハンドルで、`http://127.0.0.1` では OPFS（ブラウザ内蔵の仮想ファイルシステム）の実ハンドルで検証する。`\u003cinput>` 経路とドロップ経路は実ファイルで検証する。\n- 全項目の自動テスト（Playwright）の対象は Chromium とする。Firefox / Safari については、同じエンジンを使うブラウザー（Gecko 系のビルド、WebKitGTK）を WebDriver で操作して主要機能を確認する。製品版の Firefox / Safari そのものはテスト環境に導入できないため、手動確認チェックリストに残す。\n- 自動化できない項目（ネイティブダイアログ、Windows 実機、Firefox / Safari）は手動確認チェックリストとしてテスト報告書に記載する。\n\n合格基準: 自動テストが全件成功し、E2E 実行中にコンソールエラー・CSP 違反・想定外の外部リクエストが発生しないこと（悪意のある文書を使うセキュリティテストでは、CSP が遮断した記録だけが出ること）。全要件 ID がいずれかのテストまたは手動確認項目に対応づけられていること。\n\n---\n\n## 11. 既知の制約\n\n- `\u003cinput webkitdirectory>` 方式でフォルダを開く場合、ブラウザが「ファイルをアップロードしますか」という確認を表示することがある（実際には外部へ送信されない）。この方式ではブラウザがフォルダ内の全ファイルを列挙するため、巨大なフォルダでは時間がかかる。\n- 文字コードの自動判定は UTF-8 / UTF-16(BOM) / Shift_JIS のみ。EUC-JP 等は非対応。\n- 「前回のフォルダを開く」「自動更新」は File System Access API 対応ブラウザ（Edge / Chrome）のみ。\n- `file:` URL や `C:\\...` 形式の絶対パスによるリンク・画像は機能しない（文書セット内の相対パスで記述する）。\n- サイト HTML は文書と添付を内蔵するため、文書量に比例して大きくなる。\n- HTML をメールやチャットで送ると、経路上のシステムが内容を書き換えて動かなくなることがある。zip に入れての配布を推奨する。\n- 外部の画像を表示する側へ切り替えるには、ページの再読み込みが必要（SEC-10）。閲覧モードでは開いているフォルダが閉じるので、開き直す。\n- 外部の画像を許可していない間は、図（Mermaid）の中で外部の画像を指定している図は表示できない（エラー表示になる）。\n- コードブロックが非常に多い文書では、表示の直後は一部のコードが色分けされておらず、数秒かけて順に色分けされる（FR-204）。\n- ブラウザーのフォルダ選択 API がない環境（Firefox / Safari）で、フォルダを選ぶ操作（`\u003cinput webkitdirectory>`）とドラッグ＆ドロップは、自動テストでは確認できていない（ファイルを選ぶ操作は確認済み）。\n- スマートフォン・タブレットの実機では確認していない。確認したのは、幅 390px・タッチ操作を模したブラウザーでの表示と操作だけである。フォルダを選ぶ操作は、端末やブラウザーによって使えない。\n- 埋め込み表示（2.1）は、条件を模したフレームで確認したもので、個々のホスティングサービスの実環境では確認していない。\n- 埋め込み表示では、表示中の文書の位置（`#/…`）が外側のページの URL に反映されるとは限らない（外側のページの作りによる）。その場合、再読み込みや URL の共有ではホーム文書に戻る。\n- お試し用に変換した HTML（6.1）では、サイトとしての書き出し・添付の保存・外部の画像の表示は使えない。\n- Mermaid は軽量版を同梱しているため、Mindmap と Architecture の図は表示できない（エラーとして表示する）。使い方（ヘルプ）と見本の「制限事項」にも記す。\n- `file://` で開いた場合、隣の `mdfolio.css` は画面には効くが、書き出しには自動では入らない（3.10 FR-1004）。書き出しに入れるには、書き出しの画面で同じファイルを選ぶ。\n- 隣の `mdfolio.css` の読み込みは Chromium でだけ確かめた。Firefox / Safari が `file://` の HTML の隣の CSS を読み込むかは未確認。\n\n---\n\n## 12. 改訂履歴\n\n| 版 | 日付 | 内容 |\n|---|---|---|\n| 0.9 | 2026-11-12 | 初版（レビュー前ドラフト） |\n| 1.0 | 2026-11-13 | 仕様レビュー（REVIEW.md）の指摘 41 件を反映 |\n| 1.1 | 2026-11-13 | 実装・テストで判明した点を反映（詳細は TEST_REPORT.md の「テストで見つかった問題」）。主な変更: 外部画像の遮断を CSP でも行う（SEC-10 を追加、FR-210・FR-702・4.2・11 章）。コードの色分けをサニタイズ後・一部後回しに変更（FR-204、NFR-2）。キーボード操作と読み上げ用の情報を追加（4.3、NFR-4、FR-212）。ツリーの並び順を「ファイル → フォルダ」に変更（FR-301）。カスタムナビのファイルを検索結果から除外（FR-401）。埋め込みデータの検証を厳格化（5.5）。除外したライブラリのハッシュを CSP から外す（FR-603）。HTML の内部構造を実装に合わせて更新（8.2: スクリプトを 2 ブロックに分割、タブのアイコンを内蔵、ほか）。ビルドの目録のファイル名を訂正（8.5）。Gecko / WebKit での確認を追加（2 章、10 章） |\n| 1.2 | 2026-11-13 | 埋め込み表示への対応（アプリ 1.0.1）。公開ページ用の変換で、置換文字（U+FFFD）をエスケープに書き換える（6.1。公開先がこの文字を含むファイルを受け付けなかったため）。別のページの中に表示する場合の動作を追加（2.1）。アプリ内のリンクをアプリ自身が処理するよう変更（FR-211。`srcdoc` で埋め込むとリンクで表示が消える問題への対処）。設定に `allowDownloads` / `lockExternalImages` / `hosted` を追加（FR-701、5.4、FR-211、FR-601、FR-604、FR-801、4.2）。外部のホスティング環境に置くための変換と、その場合に保証できない点を明記（6.1）。指で操作する端末ではファイル選択を絞り込まない（FR-102）。コピーできなかったときに、できたと表示していた点を修正（FR-204）。開始画面の「このパソコン」を「この端末」に変更（4.2）。成果物に `sample.md` と zip 作成ツールを追加（8.1、8.3）。既知の制約に、実機・実環境で未確認の範囲を追記（11 章） |\n| 1.3 | 2026-11-15 | フォルダ版を追加（8.6、アプリ 1.1.0）。CSS を本文・配色用と画面用に分け、図の配色を CSS の変数から取るようにした |\n| 1.4 | 2026-11-16 | GitHub Pages での公開に使う組み立てツールを追加（8.3）。アプリの動作は変えていない |\n| 1.5 | 2026-11-16 | 公開ページと文書の英語版を追加（8.7、8.1、8.3）。アプリの動作は変えていない |\n| 1.6 | 2026-11-16 | 公開ページの案内にもライセンス表記の全文を載せる（PG-9） |\n| 1.7 | 2026-11-16 | アプリ 1.2.0。名前を「mdfolio」に確定（「仮称」を外す）。フォルダ版の英語対応（FD-9、FD-10）。英語の 1 ファイルの見本 `sample.en.md` と変更履歴を追加（8.1）。公開ページとリリースの自動化（8.8）。1.0.1 のお試し用の写し（`dist/hosted/`）を削除。既知の制約に Mermaid の図の種類と書き出しの CSS を追記（11 章）。英語の文章の見直しと、画面の英語の単数・複数の出し分け（`i18n.js` の `{0:item|items}`）。検討していた「更新コマンドの Node.js 以外の版」「書き出す CSS の指定」「配色のコントラストの検査」は、依頼者と相談のうえ行わない |\n| 1.8 | 2026-11-16 | 変更履歴を日本語の `CHANGELOG.md` 1 つにする（英語版をなくす。依頼者の指示。管理の手間を減らすため）（8.1、8.8） |\n| 1.9 | 2026-11-17 | アプリ 1.3.0。単一 HTML の隣の `mdfolio.css` で見た目を変えられるようにし、書き出しでは選んだ CSS を埋め込めるようにした（3.10）。CSP の `style-src` に `'self' file:` を加えた。フォルダ版を廃止（8.6。依頼者と合意）。1.7 で見送った「書き出す CSS の指定」は、フォルダ版の廃止にあわせて、選んで埋め込む形で取り入れた。コマンドライン版の書き出しの言語の要件を FR-605 に移した |\n| 1.10 | 2026-11-17 | 利用者は Node.js を使わないことを明確にした。コマンドライン版の書き出しは開発者・自動化向けとし、利用者向けの説明（README、見本、公開ページ）とリリースの zip から外した（FR-604、AU-3） |\n| 1.11 | 2026-11-17 | README を、英語を `README.md`、日本語を `README.ja.md` に入れ替えた（8.1、8.7）。アプリの画面の言語の既定（`auto`）は変えない |\n"},{"path":"TEST_REPORT.md","kind":"doc","mtime":1794921899904,"text":"# mdfolio テスト報告書\n\n| 項目 | 内容 |\n|---|---|\n| 対象 | mdfolio 1.3.0（単一 HTML 版 `dist/mdfolio.html`、4,338,005 バイト、SHA-256 `80bfb828…11503d836`） |\n| 基準 | [SPEC.md](SPEC.md) 1.9 |\n| 実施日 | 2026-11-13（1.0.1）、2026-11-15（1.1.0）、2026-11-16（1.1.0 の著作権者名の変更後に再実行、1.2.0）、2026-11-17（1.3.0） |\n| 実施者 | 実装者自身（Claude）。**第三者によるテストではない** |\n\n---\n\n## 1. 結論\n\n### 1.3.0（隣の mdfolio.css、フォルダ版の廃止）\n\n- 自動テスト **385 件がすべて合格**しました（単体 187 件、ブラウザーを操作するテスト 198 件）。フォルダ版のテスト（単体・E2E）を消し、隣の `mdfolio.css` と書き出しへの埋め込みのテストを加えました（E2E 7 件、単体 5 件）。\n- 確かめたこと: 隣の `mdfolio.css` がないときは内蔵の見た目でエラーなく表示すること。あれば本文・リンク・図の色に反映すること。文書の中の `\u003clink>`・`\u003cstyle>` では別の CSS を読み込ませられないこと。`file://` で開いたとき、書き出しの画面が「隣の CSS は書き出しに入らない」と知らせること。「CSS を選ぶ」で選んだ CSS が書き出しに入り、書き出したサイトを CSS のない場所で開いてもその見た目になること。「埋め込まない」で取り消せること。`\u003c/style` を含む CSS と 1MB を超える CSS を受け付けないこと。今の HTML に埋め込まれた CSS を引き継ぐこと。`http://` で開いたときは、選ばなくても隣の CSS を候補にし、書き出しに入れること。コマンドライン版の `--css`。CSP で `file:` を CSS にだけ認め、スクリプト・画像などには認めないこと。\n- 実装中に見つけた問題: (1) HTML を分解する処理が、スクリプトの本文の中の `\u003cstyle id=\"mdv-user-style\">` という文字列を CSS と取り違えた（ビルドの検査で発見。`\u003chead>` の中だけを探すよう修正）。(2) 隣の CSS がないときも、Chromium は空の style sheet を作るので、「効いている」と誤って判断した（E2E で発見。同じファイルを画面に効かない形で読み込み直し、その成否で判断するよう修正）。\n- 公開用の一式（見た目の見本を含む日英の 12 ページ）を、GitHub Pages と同じ形で配信して確かめ、見た目の見本で色と見出しが変わることを画面で確かめました。\n- **確認できていないこと**: Gecko と WebKit での確認（`tests/cross/smoke.mjs` は `mdfolio.css` の項目に書き換えたが、この開発環境では動かしていない）。Firefox / Safari が、`file://` で開いた HTML の隣の CSS を読み込むかは未確認です。Windows / macOS の実機、スマートフォンの実機も未確認です。\n\n### 1.2.0（英語への対応の拡大、公開ページ、自動化）\n\n- 自動テスト **395 件がすべて合格**しました（単体 191 件、ブラウザーを操作するテスト 204 件）。1.1.0 から増えたのは単体の 16 件です（見本文書 6 件、公開ページ 4 件、リリース 3 件、更新コマンドとコマンドライン版の書き出しの英語の表示 3 件）。\n- 更新コマンドとコマンドライン版の書き出しは、表示の言語が実行する機械の設定で変わるようになったため、テストでは環境変数 `MDFOLIO_LANG=ja` で日本語に固定し、英語は個別のテストで確かめています。\n- 図（Mermaid）の種類の記述（使い方と見本）は、実際にブラウザーで描いて確かめました。フローチャート、シーケンス図、クラス図、状態遷移図、ER 図、ガントチャート、円グラフは描け、マインドマップとアーキテクチャ図はエラーの表示になります。\n- リリースの zip を展開し、その中のフォルダ版の更新コマンド（英語の表示）と、コマンドライン版の書き出しが動くことを確かめました。\n- 公開用の一式（日本語と英語の 12 ページ）を、GitHub Pages と同じ形で配信して確かめました（2026-11-16 の追記と同じ項目）。\n- 英語の文章を見直したあと（レビュー記録 D-10）、自動テストをすべて再実行して合格しました。画面の英語の単数・複数の出し分けは、既存の単体テストに確認を加えました（件数は変わりません）。英語の文章を英語を母語とする人に確かめてもらうことは、できていません。\n- **確認できていないこと**: GitHub Actions の 2 つの自動実行（公開ページの更新、リリースの作成）は、この開発環境では動かせません。設定ファイルの形と、中で行う手順（ビルド、単体テスト、`make-pages.mjs`、`make-release.mjs`）は手元で確かめましたが、GitHub の上での初回の実行結果は、Actions の画面で確かめる必要があります。Gecko と WebKit での確認は、この開発環境に道具がないため再実行していません。Windows / macOS の実機、スマートフォンの実機も 1.1.0 と同じく未確認です。\n\n### 1.1.0（フォルダ版の追加）\n\n- **2026-11-16 追記**: `LICENSE` の著作権者名を「mdfolio contributors」から「Particle Pudding」に変えて作り直し、自動テスト 379 件（単体 175 件、ブラウザーを操作するテスト 204 件）がすべて合格しました。動作は変えていません。単一 HTML 版の大きさとハッシュは上の表のとおり変わりました。Gecko と WebKit での確認は再実行していません（この変更で動作に差が出る箇所はありません）。`dist/hosted/` の 2 件は 1.0.1 のときに公開したページの写しなので、作り直しておらず、古い名前のままです。\n- **2026-11-16 追記（GitHub Pages）**: 公開用の一式（`tools/dev/make-pages.mjs` の出力）を、GitHub Pages と同じ形（`/mdfolio/` の下に http で配信）で Chromium で開き、案内のページ・書き出しの見本・ビューア・フォルダ版の見本・説明書の 5 ページがエラーなく表示され、外部への通信と読み込みの失敗（404）がないこと、幅 390px で横にはみ出さないこと、フォルダ版で数式と図が `lib/` から読み込まれることを確認しました。**実際の公開先（github.io）で開いた確認はできていません**（この開発環境から公開先に接続できるかは未確認）。\n- **2026-11-16 追記（日本語と英語の両対応。SPEC 8.7）**: 英語の見本文書・README・公開ページを加えました。自動テスト **384 件がすべて合格**しました（単体 180 件、ブラウザーを操作するテスト 204 件）。増えたのは見本文書の単体テスト 5 件で、日本語と英語の見本の構成と記法の見本がそろっていること、英語の見本のファイル名が英語であること、両方の見本の相対リンク・画像・見出しへのリンクの参照先が実在すること（PG-4、PG-8）を確かめます。わざと見出しへのリンクを壊すと不合格になることも確かめました。\n  公開用の一式は、GitHub Pages と同じ形で配信して Chromium で確認しました（このテストは公開の手順の確認で、自動テストの件数には入れていません）: 日本語と英語の 12 ページがエラーなく表示され、外部への通信と読み込みの失敗がなく、幅 390px で横にはみ出さないこと。案内のページの言語の切り替えリンク、`hreflang`、すべてのカードのリンク先。見本と説明書を**反対の言語に設定したブラウザー**で開いても、画面の言語が文書の言語になること（PG-3）。英語の見本で、文書間の移動、見出しへのリンク、数式・図（図の中の英語の文字）、画像、検索（`MERMAID`）。\n  見本文書の見直しで、日本語の「配布方法」の「方法は 2 つあります」が、実際には 3 つ書かれていたので「3 つ」に直しました。\n  確認できていないこと: 実際の公開先（github.io）での表示。英語の文章の自然さは、英語を母語とする人に確かめてもらっていません。\n- **2026-11-16 追記（ライセンス表記。PG-9）**: 公開ページの案内（日本語・英語）に、ライセンス表記の全文を折りたたみの欄で載せました。単体テストを 4 件加え（計 184 件、すべて合格）、公開ページの 9 つの HTML すべてに `LICENSE` と `THIRD-PARTY-NOTICES.txt` の全文が入っていること（フォルダ版は `lib/resources.js`）、案内のページがスクリプトと外部の読み込みを使わないこと、見本の画面の言語の固定を確かめます。案内のページの欄が開けて、幅 390px でも横にはみ出さないことをブラウザーで確かめました。\n- 自動テスト **379 件がすべて合格**しました（単体 175 件、ブラウザーを操作するテスト 204 件）。1.0.1 から増えたのは、フォルダ版の単体 7 件と E2E 13 件です。1.0.1 までのテストは、CSS を 2 つのファイルに分けたあとの単一 HTML 版で、すべて合格しています。\n- Gecko と WebKit でも、フォルダ版を `file://` で開く確認を 2 項目加え、それぞれ 18 項目中 17 項目が合格、1 項目が未確認（自動操作できない操作。1.0.1 と同じ）でした。\n- 確認したのは、所定の文書の表示、`lib/` からの数式・図のライブラリの読み込み、`document.css` の変更が本文・画面・図（ライト・ダーク）と印刷に反映されること、別のフォルダを開いてから戻る操作、書き出し（更新コマンドで写した CSS が使われ、写す前の変更は入らないこと）、更新コマンドの動作（コマンドライン版の書き出しと同じデータを作ること、誤りのときにファイルを壊さないこと）、外部の画像を読み込まないこと、インラインのスクリプトが実行されないこと、既定の配色でのアクセシビリティの自動検査です。\n- 実装中に見つけて直した問題が 3 件あります（6 章 T-25〜T-27）。\n- 確認できていないこと: Windows と macOS の実機（特に、共有フォルダに置いて開いた場合）、Edge と製品版の Firefox / Safari。利用者が配色を変えた場合のコントラストは、自動では確かめていません（既定の配色だけを検査）。\n\n### 1.0.1\n\n- 自動テスト **359 件がすべて合格**しました（単体 168 件、ブラウザーを操作するテスト 191 件）。スキップはありません。ただし、最終確認の途中の 1 回の実行で、性能テストの 1 件が不合格になりました（4 章。再実行では合格）。\n- 仕様書の要件 68 項目（FR 51、SEC 10、NFR 7）は、すべていずれかのテストに対応づけてあります（7 章）。\n- Chromium のほかに、Firefox のエンジン（Gecko 160）と Safari 系のエンジン（WebKitGTK 2.52）でも主要機能 16 項目を確認し、それぞれ 15 項目が合格、1 項目が未確認（自動操作できない操作）でした。\n- テストの過程で、製品の問題が **22 件**、配布物（zip）の問題が **1 件**見つかり、すべて修正しました（6 章）。うち 1 件は「外部と通信しない」という要件に反する重要なものでした。1.0.1 で見つかったのは、このうち製品 6 件と配布物 1 件です。\n- 自動テストでは確認できなかったことが残っています（8 章）。製品版の Firefox / Safari、Windows / macOS の実機、**スマートフォンの実機**、**実際のホスティング環境（Claude のアーティファクトなど）**、ブラウザー本来のフォルダ選択画面を通した操作、紙への印刷です。手動確認の一覧を付けました。\n- 1.0.1 で加えた「別のページの中に埋め込んだ表示」は、条件を模したフレームで確認したものです。サンプルのページ 2 つを公開する操作は成功しましたが、**公開されたページを開いて、表示と操作を確かめることはできていません**（確認に使えるブラウザーが、公開先にサインインしていなかったため）。\n\n---\n\n## 2. テスト環境\n\n| 項目 | 内容 |\n|---|---|\n| 機械 | Linux（Ubuntu 24.04）、2 コア（Intel Xeon 2.1GHz）、メモリ 8GB |\n| Node.js | 22.23.4 |\n| ブラウザー（全項目） | Chromium 153.0.8010.12（Chrome for Testing、ヘッドレス）、Playwright 1.63.0 |\n| ブラウザー（主要機能） | WebKitGTK 2.52.6（MiniBrowser、WebKitWebDriver）／ Gecko 160.0（Zen Browser 1.24.2b のビルド、geckodriver 0.36.0） |\n| 検査エンジン | axe-core 4.14.0（アクセシビリティ） |\n| 開き方 | 主に `file://`（HTML を直接開く形）。一部は `http://127.0.0.1` |\n\nテストの考え方:\n\n- ビルドした `dist/mdfolio.html` そのものを、実際のブラウザーで操作して確認しました（部品だけを取り出したテストではありません）。\n- 各テストの最後に、**コンソールのエラー・CSP 違反・想定外の通信がないこと**を確かめています。悪意のある文書を使うテストだけは、CSP が遮断した記録が出ることを許し、それ以外のエラーがないことを確かめています。\n- 「外部と通信していない」ことは、ブラウザー側の記録ではなく、**外部サーバーの代わりに立てたローカルの HTTP サーバーに届いたリクエストの有無**で判定しました。\n- Gecko は、Firefox の配布元にテスト環境から接続できなかったため、同じエンジンを使う別のブラウザーのビルドで確認しました。エンジンは同じですが、Firefox そのものではありません。\n- 埋め込み表示は、2 種類のフレームで確認しました。(1) 公開ページを模したもの: 親ページとは別のオリジンから配信し、`sandbox`（保存・ダイアログ・最上位の移動を禁止）を付け、画像を `data:` / `blob:` に限る CSP をヘッダーで付け、`\u003chead>` の先頭に別のスクリプトを差し込む。(2) `srcdoc` で埋め込むもの: 文書の URL が `about:srcdoc` になり、保存領域を使えなくした場合も含む。条件は、ホスティング側が公開している説明から組み立てたもので、実環境と同じである保証はありません。\n\n---\n\n## 3. 結果\n\n| ファイル | 内容 | 件数 | 合格 | 所要 |\n|---|---|---:|---:|---:|\n| `tests/unit/core.test.mjs` | パス解決、ルート、スラッグ、文字コード判定、検索、ツリー、style の制限、サイトデータ、HTML の組み立て | 82 | 82 | 0.3 秒 |\n| `tests/unit/md.test.mjs` | Markdown の拡張（数式、タスクリスト、アラート、見出し ID、参照の抽出） | 43 | 43 | 0.5 秒 |\n| `tests/unit/build.test.mjs` | 成果物の構造、CSP のハッシュ、同梱ライブラリの目録とライセンス、ビルドの再現性、文言の対応 | 19 | 19 | 1.1 秒 |\n| `tests/unit/cli.test.mjs` | コマンドライン版の書き出し | 15 | 15 | 4.0 秒 |\n| `tests/unit/package.test.mjs` | zip の作成（日本語のファイル名）、外部のホスティング環境に置くための変換（置換文字の書き換えを含む） | 9 | 9 | 2.0 秒 |\n| `tests/e2e/startup.e2e.mjs` | 起動、CSP、ヘルプ、ライセンス表示、保存領域が使えない場合 | 13 | 13 | 7 秒 |\n| `tests/e2e/open.e2e.mjs` | フォルダ・ファイル・ドロップでの読み込み、除外、文字コード、上限、エラー | 22 | 22 | 14 秒 |\n| `tests/e2e/render.e2e.mjs` | 表示（表、コード、数式、図、脚注、アラート、画像、目次）、コードの色分けの後回し | 19 | 19 | 16 秒 |\n| `tests/e2e/navigate.e2e.mjs` | リンク、戻る／進む、スクロール位置、ツリー、カスタムナビ、添付のダウンロード | 23 | 23 | 13 秒 |\n| `tests/e2e/search.e2e.mjs` | 全文検索、キーボード操作、一致語の強調、索引 | 17 | 17 | 17 秒 |\n| `tests/e2e/settings.e2e.mjs` | テーマ、言語、外部画像、画面幅、指で操作する端末、印刷、横スクロールバー | 16 | 16 | 13 秒 |\n| `tests/e2e/export.e2e.mjs` | 書き出し、サイトモード、未使用ライブラリの除外、コマンドライン版との一致 | 20 | 20 | 13 秒 |\n| `tests/e2e/security.e2e.mjs` | スクリプトの除去、ID の保護、リンク、外部通信、CSP、改ざんの検出 | 14 | 14 | 25 秒 |\n| `tests/e2e/fsa.e2e.mjs` | 再読み込み、自動更新、前回のフォルダ（本物のハンドルを含む） | 11 | 11 | 28 秒 |\n| `tests/e2e/a11y.e2e.mjs` | axe-core による検査、配色、キーボード操作、フォーカス | 17 | 17 | 26 秒 |\n| `tests/e2e/perf.e2e.mjs` | 性能（NFR-2） | 4 | 4 | 45 秒 |\n| `tests/e2e/embed.e2e.mjs` | 保存を使わない設定、外部画像の固定、お試し用の公開ページの表示、別オリジンのサンドボックス化したフレーム・`srcdoc` のフレームの中での動作、変換の前後で表示が変わらないこと | 15 | 15 | 31 秒 |\n| `tests/unit/folder.test.mjs` | フォルダ版のビルドと更新コマンド（1.1.0） | 7 | 7 | 1.5 秒 |\n| `tests/e2e/folder.e2e.mjs` | フォルダ版を `file://` で開いたときの動作（1.1.0） | 13 | 13 | 13 秒 |\n| **合計（1.1.0）** | | **379** | **379** | 約 4.3 分 |\n| （参考）1.0.1 の合計 | | 359 | 359 | |\n\n元データは `test-results/`（`summary.json`、各ファイルの `.tap`）にあります。\n\n---\n\n## 4. 性能（NFR-2）\n\n2 コアの機械（仕様が想定する程度）で計測しました。目標値をそのまま合格基準にしています。\n\n| 項目 | 目標 | 計測値 | 補足 |\n|---|---:|---:|---|\n| 起動から開始画面の表示まで | 1,000 ms | 150 ms（最初の描画まで 200 ms） | 7 回の中央値。最大 264 ms |\n| 1MB の文書の表示 | 3,000 ms | 2,230 ms | 5 回の中央値。最大 2,337 ms。見出し・表・コードブロックを各 1,653 個含む、密度の高い文書 |\n| 1,000 文書: ツリー表示 | 2,000 ms | 54 ms | 実ファイルを `\u003cinput>` で開いた場合は 424 ms |\n| 1,000 文書: 索引作成 | 10,000 ms | 801 ms | 実ファイルの場合は 1,557 ms |\n| 1,000 文書: 検索応答 | 300 ms | 171 ms | 入力待ち 150 ms を含む。5 種類の検索語の最大値 |\n\n- 1MB の文書は、修正前は 2.9〜3.4 秒で目標ぎりぎりでした（6 章 T-11）。コードの色分けを後回しにする変更で上の値になりました。色分けがすべて終わるのは表示の 4〜7 秒後です（参考値。実行のたびに変わります。操作を妨げない範囲で少しずつ処理します）。\n- 計測値は実行のたびに 1〜2 割ほど変わります。上は 1.0.1 の最終実行の値です。1.0.1 の変更は、表示の処理には手を入れていません。\n- **1MB の文書の表示は、余裕が十分とは言えません。** このテストは 5 回の計測の最大値も目標以内であることを求めています。最終確認のうち 1 回の実行（テスト環境を再開した直後）では、5 回のうち 1 回が 3,092 ms になり、このテストが不合格になりました（そのときの中央値は 2,023 ms）。単独での再実行 2 回（最大 2,375 ms、2,289 ms）と、上の表の全体の再実行では合格しています。負荷のかかった機械や、想定より遅い機械では、3 秒を超えることがあります。\n- 成果物のサイズは 4.12MB で、目標の 6MB 以下です（NFR-3）。\n\n---\n\n## 5. アクセシビリティ（NFR-4）\n\n| 確認 | 結果 |\n|---|---|\n| axe-core による自動検査 | 開始画面、文書、検索結果、メニュー、3 種類のダイアログ、使い方、エラー表示、カスタムナビ、英語表示など 15 の画面 × ライト／ダーク、および狭い画面で**違反 0 件** |\n| 文字と背景のコントラスト比 | 画面に出る 328 の組み合わせを実際の色から計算し、すべて 4.5:1 以上。最小はライト 4.54:1、ダーク 5.30:1。印刷用の配色も確認 |\n| キーボードだけでの操作 | Tab の順序、メニュー（矢印・Home・End・Esc）、ダイアログ（中だけを巡る・閉じると元へ戻る）、文書一覧、目次、コピー、横に長い表とコードのスクロール、タブの切り替え |\n| フォーカスの見え方 | ページ内の Tab で止まるすべての要素で、フォーカスの枠が出ることを確認 |\n| 動きを減らす設定 | 設定が有効なとき、アニメーションと滑らかなスクロールが 0 件になることを確認 |\n| 読み上げのための情報 | 画面の区分（ヘッダー、文書一覧、本文、目次）、検索欄と結果一覧の役割、件数の通知、チェックボックスの状態 |\n\n確認していないこと: 実際の読み上げソフト（NVDA、VoiceOver など）での聞こえ方。文書の作者が `style` で指定した色（アプリは調整しません）。\n\n---\n\n## 6. テストで見つかった問題と対応\n\n仕様レビュー（[REVIEW.md](REVIEW.md)）では見つけられず、実装後のテストで見つかったものです。すべて修正し、再発を防ぐテストを追加しました（T-17 と T-22 は、テストで再現できていない予防的な修正です）。重要度の高い順に並べています。T-02 は製品ではなくテスト環境の問題でした。T-18 以降は 1.0.1 で見つかったものです。T-24 は、テストではなく、実際に公開する操作で見つかりました。\n\n| # | 重要度 | 見つかった問題 | 見つけた方法 | 対応 |\n|---|---|---|---|---|\n| T-08 | **高** | 外部の画像を止めている状態でも、**図（Mermaid）の中の画像指定から外部へ通信が発生した**（画像ノード、ラベル内の `\u003cimg>`、`themeCSS` の `url()`）。「既定では外部と通信しない」という要件に反する | 通信の有無を、ローカルに立てたサーバーへの到達で確かめるテスト | 許可していない間は、ブラウザーの CSP でも画像・メディアの読み込みを止めるようにした（SEC-10）。許可へ切り替えるときは確認の上で再読み込みする。Chromium・Gecko・WebKit で、サーバーに 1 件も届かないことを確認 |\n| T-18 | 中 | HTML を `srcdoc` で埋め込んだフレームの中で文書間のリンクを押すと、フレームが別のページ（`about:blank` や親ページ）へ移動し、**表示が消える**。文書の URL とリンクの基準 URL が異なる環境で、リンクの移動をブラウザーに任せていたため（1.0.0 にあった問題） | 埋め込み表示のテスト（1.0.1 で追加）。実験で再現を確認 | アプリ内のリンクをアプリ自身が処理するようにした（FR-211）。Chromium・Gecko・WebKit のフレームで確認 |\n| T-19 | 中 | **配布物の問題**: `mdfolio-1.0.0.zip` の中の日本語のファイル名（`sample-docs` の `基本操作.md` など）に、UTF-8 であることを示す印が付いていなかった。Windows の環境によっては、展開したときにファイル名が文字化けし、サンプルの文書間のリンクが切れる | 配布物の点検（zip の各項目のフラグを機械的に調べた）。**Windows の実機では再現も解消も確かめていない** | zip を作る道具を替え（`tools/dev/make-zip.py`）、作成後に全項目の印を検証する。作り直した zip に差し替えた |\n| T-24 | 中 | 公開ページ用に変換した HTML を、公開先（Claude のアーティファクト）が受け付けなかった。置換文字（U+FFFD）を含むファイルは公開できないためで、同梱ライブラリ（markdown-it）のスクリプトがこの文字そのものを 11 か所で使っている | **実際の公開の操作**（模したフレームでのテストでは分からなかった） | 変換で、同じ意味のエスケープに書き換える（SPEC 6.1）。意味を変えずに書き換えられると言い切れない場所にある場合は、変換をやめる。書き換えの前後で、不正な入力（NUL 文字、文字として読めない `%XX`）の表示結果が同じであることを確認 |\n| T-25 | 中 | （フォルダ版）印刷用の配色の指定が、`document.css` の後ろに利用者が足した配色の指定に負け、ダークの配色を変えると印刷もその色になる | フォルダ版の E2E（印刷） | 印刷用の指定のセレクターを二重にして詳細度を上げた |\n| T-26 | 中 | （フォルダ版）更新コマンドが、CSS に誤りがあって終了する前に `data/site.js` を書き換えていた | 単体テスト | CSS を先に読んで確かめ、誤りがあればどのファイルも書き換えないようにした |\n| T-27 | 低 | （フォルダ版）更新コマンドを `--title` なしで実行すると、前に指定したタイトルが消える | フォルダ版の E2E（書き出しのタイトル） | 指定がなければ前回の指定を引き継ぐ。ホームも、その文書が残っていれば引き継ぐ |\n| T-13 | 中 | アクセシビリティの不備 5 件: タスクリストのチェックボックスに名前がない、横スクロールする表にキーボードで届かない、検索結果の一覧に名前がない、脚注の戻りリンクが色だけで区別されている、ダークテーマで数式のエラー表示が読みにくい（2.54:1） | axe-core | すべて修正。あわせて、メニューとタブの矢印キー操作、ダイアログを閉じたあとのフォーカスの戻り先を追加 |\n| T-15 | 中 | スクロールバーを常に表示する環境（Windows など）で、サイドバーに不要な横スクロールバーが出る | WebKit / Gecko での画面の確認（テスト用の Chromium はスクロールバーを隠すため見えていなかった） | 罫線の描き方を変えて、はみ出しをなくした。はみ出しを数値で検出するテストを追加 |\n| T-11 | 中 | 1MB の密度の高い文書の表示が 2.9〜3.4 秒で、目標（3 秒）を超えることがあった | 性能テスト | コードの色分けをサニタイズの後に移し、一定量を超えた分は表示のあとで処理するようにした（2.3 秒） |\n| T-10 | 中 | 埋め込まれた文書データの形式が想定外（種類が不明など）だと、起動時に例外が出て画面が表示されなかった | セキュリティテスト（壊れたデータを与える） | 検証を厳しくし、読み込まずに通知して開始画面を出すようにした |\n| T-06 | 中 | 検索結果を開いたあと、検索欄からフォーカスが奪われ、Esc で結果を閉じられなかった | 検索のテスト | 入力中の欄からフォーカスを奪わないようにし、Esc の扱いを直した |\n| T-04 | 中 | 目次の「現在位置」がずれる。文書の末尾では最後の見出しが現在位置にならない | 表示のテスト | スクロール位置の補正が二重になっていたのを直し、末尾の扱いを追加 |\n| T-01 | 中 | 金額とコードが混ざった文で、離れた `$` どうしが数式として扱われた | 単体テスト | インライン数式の判定を直した |\n| T-12 | 低 | 検索結果を開いた直後に検索欄へ戻ると、結果のパネルが開かないことがあった（約 3 回に 1 回） | テストの繰り返し実行 | 画面の切り替えを、遅れて届くイベントを待たずに行うようにした |\n| T-14 | 低 | 書き出したサイトの CSP に、取り除いたライブラリのハッシュが残っていた | コマンドライン版のテスト | ハッシュも取り除くようにした |\n| T-16 | 低 | 検索結果に、ナビ用のファイル（`_sidebar.md`）が出る | 画面の確認 | 検索結果から除いた |\n| T-09 | 低 | 見出しの中の表示できない画像の説明文が、目次に混ざる | セキュリティテスト | 目次の文字列から除いた |\n| T-07 | 低 | 書き出しに含める添付の種別が、ブラウザーや OS によって変わりうる | 書き出しのテスト | 拡張子から決めるようにした |\n| T-05 | 低 | サイドバーのナビの見出しに、不要なアンカーリンクが付く | 画面の確認 | 付けないようにした |\n| T-03 | 低 | 見た目の不備 4 件（本文領域のフォーカス枠、開始画面のボタンの位置、ナビの区切りの体裁、図の既定の配色） | 画面の確認 | 修正 |\n| T-20 | 低 | コードのコピーに失敗しても「コピーしました」と表示する（従来の方式でのコピーの結果を確かめていなかった）。また、従来の方式に切り替わると、選択のためにページの末尾へ画面が動くおそれがあった | 埋め込み表示のテストと、コードの見直し（フレームの中では従来の方式が主な経路になるため） | 結果を確かめ、できなかったときは「コピーできませんでした」と表示する。一時的な入力欄を画面に固定する。フレームの中では従来の方式を先に試す（FR-204） |\n| T-21 | 低 | 開始画面と使い方の「このパソコンの中だけで処理され」という説明が、スマートフォンで開いた場合に合わない。また、CSP を外して公開ページに置いた HTML では、「外部には送信されません」を HTML 自身では保証できない | 画面の確認（スマートフォン相当の幅）、仕様の見直し | 「この端末」に変更。指で操作する端末ではドロップの案内を省く。お試し用の公開ページ向けの文言を追加（`hosted`） |\n| T-23 | 低 | 公開ページ用の変換ツール（`make-hosted.mjs`）に mdfolio 以外の HTML を渡すと、理由を表示せず内部エラーで止まる（1.0.1 で追加したツール） | 単体テスト | 理由を表示して終了するよう修正 |\n| T-22 | 低 | スマートフォンでは、ファイルの選択を Markdown に絞り込んでいると、`.md` のファイルを選べない端末がありうる（種類の扱いが端末や保存先のアプリで異なる） | 設計の見直し（**テスト環境では再現できず、実機でも確かめていない**） | 指で操作する端末では絞り込まない（FR-102） |\n| T-17 | 低 | Web サーバーに置いた場合、ブラウザーが `favicon.ico` を取りに行く（HTML 以外の通信になる） | 設計の見直し（テストでは再現していない） | タブのアイコンを HTML の中に持たせた |\n| T-02 | — | 日本語のファイル名を含むフォルダで、テスト用のブラウザーが異常終了した | 読み込みのテスト | テスト環境のロケール設定が原因で、製品の問題ではなかった。テスト側を直した |\n\nT-08 について補足します。レビューでは Mermaid を「安全な設定（`securityLevel: 'strict'`）で使う」としていましたが、その設定でも画像の読み込みは止まりませんでした。通信の有無を「ブラウザーが送ろうとしたか」ではなく「サーバーに届いたか」で判定するテストにしたことで見つかりました。\n\n---\n\n## 7. 要件との対応\n\n「確認したテスト」は `tests/` 以下のファイルです（`cross/smoke` は Gecko / WebKit での確認）。\n\n| ID | 要件 | 確認したテスト | 補足 |\n|---|---|---|---|\n| FR-101 | フォルダを開く | e2e/open | ブラウザー本来のフォルダ選択画面は自動操作できない。差し替えたハンドルと `\u003cinput>` で確認 |\n| FR-102 | ファイルを開く | e2e/open, e2e/settings, e2e/embed, cross/smoke | 指で操作する端末での絞り込みなしは、タッチ操作を模したブラウザーで確認（実機では未確認） |\n| FR-103 | ドラッグ＆ドロップ | e2e/fsa, e2e/open |
