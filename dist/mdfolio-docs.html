<title>mdfolio ドキュメント</title>
<style id="mdv-style">/*
 * mdfolio — 画面の部品（app.css）
 *
 * ヘッダー・サイドバー・目次・メニュー・ダイアログなど、画面の部品の配置と形を決めています。
 * 配色・書体・幅は document.css の変数で変えられるので、通常はこのファイルを編集する必要はありません。
 *
 * MIT License
 */

/* ------------------------------------------------------------------ 土台 */

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: calc(var(--header-h) + 16px);
}

body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.8;
  overflow-wrap: break-word;
}

[hidden] { display: none !important; }

.mdv-app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.mdv-app :focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.mdv-skip {
  position: absolute;
  left: 8px;
  top: -48px;
  z-index: 60;
  padding: 6px 12px;
  background: var(--accent);
  color: var(--sheet);
  border-radius: var(--radius);
  text-decoration: none;
}
.mdv-skip:focus { top: 8px; }

.mdv-icon {
  width: 20px;
  height: 20px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ------------------------------------------------------------------ ボタン */

.mdv-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 18px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--sheet);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  line-height: 1.3;
  cursor: pointer;
}
.mdv-btn:hover { border-color: var(--muted); }
.mdv-btn[disabled] { opacity: 0.5; cursor: default; }

.mdv-btn-primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--sheet);
}
.mdv-btn-primary:hover { border-color: var(--accent-strong); background: var(--accent-strong); }

.mdv-btn-quiet {
  border-color: transparent;
  background: transparent;
  color: var(--accent);
  padding: 0 10px;
}
.mdv-btn-quiet:hover { border-color: transparent; background: var(--accent-soft); }

.mdv-iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
}
.mdv-iconbtn:hover { background: var(--rule-soft); color: var(--ink); }

/* ------------------------------------------------------------------ ヘッダー */

.mdv-header {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--header-h);
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  background: var(--desk);
  border-bottom: 1px solid var(--rule);
}

.mdv-title {
  min-width: 0;
  margin: 0 auto 0 4px;
  padding-right: 12px;
  overflow: hidden;
  color: var(--ink);
  font-weight: 700;
  font-size: 1rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mdv-title:hover { color: var(--accent); }

.mdv-search {
  position: relative;
  flex: 0 1 440px;
  min-width: 120px;
}

.mdv-search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  width: 18px;
  height: 18px;
  margin-top: -9px;
  color: var(--muted);
  pointer-events: none;
}

.mdv-search-input {
  width: 100%;
  height: 36px;
  box-sizing: border-box;
  padding: 0 64px 0 36px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--sheet);
  color: var(--ink);
  font: inherit;
  font-size: 0.9375rem;
  appearance: none;
  -webkit-appearance: none;
}
.mdv-search-input::placeholder { color: var(--muted); opacity: 1; }
.mdv-search-input::-webkit-search-cancel-button { -webkit-appearance: none; }
.mdv-search-input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -1px; }

.mdv-search-kbd {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  padding: 1px 6px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: 0.75rem;
  line-height: 1.5;
  pointer-events: none;
}

.mdv-search-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 40;
  width: min(560px, calc(100vw - 24px));
  max-height: min(70vh, 640px);
  overflow: auto;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--sheet);
  box-shadow: var(--overlay-shadow);
}

.mdv-search-list { margin: 0; padding: 6px; list-style: none; }

.mdv-search-item {
  display: block;
  padding: 8px 10px;
  border-radius: var(--radius);
  color: var(--ink);
  text-decoration: none;
  line-height: 1.5;
}
.mdv-search-item:hover,
.mdv-search-item.is-active { background: var(--accent-soft); }

.mdv-search-item-title { display: block; font-weight: 700; }
.mdv-search-item-path { display: block; color: var(--muted); font-size: 0.8125rem; }
.mdv-search-item-snippet {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  margin-top: 2px;
  color: var(--ink-soft);
  font-size: 0.875rem;
}

.mdv-search-empty { margin: 0; padding: 18px 16px; color: var(--muted); }

.mdv-search-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 16px;
  border-top: 1px solid var(--rule-soft);
  color: var(--muted);
  font-size: 0.8125rem;
}

.mdv-app mark,
.mdv-hit {
  padding: 0 1px;
  border-radius: 2px;
  background: var(--mark);
  color: var(--mark-ink);
}

/* ------------------------------------------------------------------ メニュー */

.mdv-menu-wrap { position: relative; }

.mdv-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 40;
  min-width: 248px;
  padding: 6px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--sheet);
  box-shadow: var(--overlay-shadow);
}

.mdv-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 38px;
  box-sizing: border-box;
  padding: 0 10px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 0.9375rem;
  line-height: 1.3;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}
.mdv-menu-item:hover { background: var(--accent-soft); }
.mdv-menu-item .mdv-icon { width: 18px; height: 18px; color: var(--muted); }
.mdv-menu-item[aria-checked="true"] .mdv-menu-check { visibility: visible; }
.mdv-menu-check { margin-left: auto; visibility: hidden; color: var(--accent); }
.mdv-menu-sep { height: 1px; margin: 6px 4px; background: var(--rule-soft); }

/* ------------------------------------------------------------------ 配置 */

.mdv-body {
  flex: 1;
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  align-items: start;
}
.mdv-app[data-sidebar="closed"] .mdv-body,
.mdv-app[data-has-set="false"] .mdv-body { grid-template-columns: minmax(0, 1fr); }
.mdv-app[data-sidebar="closed"] .mdv-sidebar,
.mdv-app[data-has-set="false"] .mdv-sidebar,
.mdv-app[data-has-set="false"] .mdv-btn-sidebar { display: none; }

.mdv-sheet {
  display: grid;
  grid-template-columns: minmax(0, var(--content-w)) var(--toc-w);
  justify-content: center;
  column-gap: 56px;
  min-height: calc(100vh - var(--header-h));
  box-sizing: border-box;
  padding: 0 40px;
  background: var(--sheet);
}
.mdv-app[data-view="welcome"] .mdv-sheet { grid-template-columns: minmax(0, 1fr); }

.mdv-main {
  min-width: 0;
  padding: 28px 0 112px;
}
/* 文書を切り替えるたびにフォーカスを移す入れ物なので、枠は表示しない */
.mdv-app .mdv-main:focus,
.mdv-app .mdv-main:focus-visible { outline: none; }

/* ------------------------------------------------------------------ サイドバー（綴じ込みの見出しタブ） */

.mdv-sidebar {
  position: sticky;
  top: var(--header-h);
  height: calc(100vh - var(--header-h));
  box-sizing: border-box;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 0 32px 12px;
  /* 右端の罫線は枠線ではなく内側の影で描く。表示中の文書のタブがその上に重なって、紙と地続きに見える
     （枠線の上へはみ出させる方法だと、スクロールバーを常に表示する環境で横スクロールバーが出てしまう） */
  box-shadow: inset -1px 0 0 var(--rule);
  font-size: 0.9375rem;
  line-height: 1.45;
}

.mdv-side-tabs {
  display: flex;
  gap: 4px;
  margin: 0 12px 10px 0;
  padding: 3px;
  border-radius: 8px;
  background: var(--rule-soft);
}
.mdv-side-tab {
  flex: 1;
  height: 30px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
}
.mdv-side-tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); }

.mdv-tree,
.mdv-tree ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.mdv-tree ul {
  margin-left: 13px;
  padding-left: 7px;
  border-left: 1px solid var(--rule);
}

.mdv-tree-link,
.mdv-tree summary,
.mdv-sidenav a {
  display: block;
  position: relative;
  padding: 6px 12px 6px 10px;
  border: 1px solid transparent;
  border-right: 0;
  border-radius: var(--radius) 0 0 var(--radius);
  color: var(--ink-soft);
  text-decoration: none;
}
.mdv-tree-link:hover,
.mdv-tree summary:hover,
.mdv-sidenav a:hover { color: var(--ink); background: var(--rule-soft); }

.mdv-tree summary {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-left: 4px;
  list-style: none;
  cursor: pointer;
  font-weight: 600;
  color: var(--ink);
}
.mdv-tree summary::-webkit-details-marker { display: none; }
.mdv-tree summary .mdv-icon { width: 16px; height: 16px; color: var(--muted); transition: transform 0.12s ease; }
.mdv-tree details[open] > summary .mdv-icon { transform: rotate(90deg); }

/* 表示中の文書: 紙（本文）と地続きのタブにする */
.mdv-tree-link[aria-current="page"],
.mdv-sidenav a[aria-current="page"] {
  position: relative; /* サイドバー右端の罫線（内側の影）より手前に描く */
  border-color: var(--rule);
  background: var(--sheet);
  color: var(--accent);
  font-weight: 700;
  box-shadow: inset 3px 0 0 var(--accent);
}

.mdv-sidenav { padding-right: 0; }
.mdv-sidenav ul,
.mdv-sidenav ol { margin: 0; padding: 0; list-style: none; }
.mdv-sidenav li > ul,
.mdv-sidenav li > ol { margin-left: 13px; padding-left: 7px; border-left: 1px solid var(--rule); }
.mdv-sidenav p { margin: 0; }
.mdv-sidenav-label,
.mdv-sidenav > p,
.mdv-sidenav h1, .mdv-sidenav h2, .mdv-sidenav h3, .mdv-sidenav h4 {
  display: block;
  margin: 14px 12px 2px 10px;
  color: var(--muted);
  font-size: 0.8125rem;
  font-weight: 700;
  line-height: 1.5;
}
.mdv-sidenav > :first-child { margin-top: 2px; }

.mdv-scrim {
  position: fixed;
  inset: var(--header-h) 0 0 0;
  z-index: 24;
  background: var(--scrim);
}

/* ------------------------------------------------------------------ 目次（紙の余白の書き込み） */

.mdv-toc {
  position: sticky;
  top: calc(var(--header-h) + 28px);
  max-height: calc(100vh - var(--header-h) - 56px);
  box-sizing: border-box;
  overflow-y: auto;
  padding: 2px 0 8px;
  font-size: 0.875rem;
  line-height: 1.5;
}
.mdv-app[data-view="welcome"] .mdv-toc { display: none; }

.mdv-toc-title {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 0.8125rem;
  font-weight: 700;
}

.mdv-toc-list { margin: 0; padding: 0; list-style: none; border-left: 1px solid var(--rule); }
.mdv-toc-link {
  display: block;
  margin-left: -1px;
  padding: 3px 0 3px 12px;
  border-left: 2px solid transparent;
  color: var(--muted);
  text-decoration: none;
}
.mdv-toc-link:hover { color: var(--ink); }
.mdv-toc-link.is-current { border-left-color: var(--accent); color: var(--accent); font-weight: 700; }
.mdv-toc-link[data-depth="1"] { padding-left: 24px; }
.mdv-toc-link[data-depth="2"] { padding-left: 36px; }
.mdv-toc-link[data-depth="3"] { padding-left: 48px; }

.mdv-toc-inline {
  display: none;
  margin: 0 0 24px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-size: 0.9375rem;
}
.mdv-toc-inline > summary { padding: 8px 14px; font-weight: 700; cursor: pointer; }
.mdv-toc-inline .mdv-toc-list { margin: 0 14px 12px; }

/* ------------------------------------------------------------------ 文書の上部（パス・更新日時） */

.mdv-doc-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 16px;
  margin: 0 0 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule-soft);
  color: var(--muted);
  font-size: 0.8125rem;
  line-height: 1.5;
}
.mdv-doc-path { min-width: 0; }
.mdv-doc-sep { margin: 0 0.4em; color: var(--rule); }

.mdv-notice {
  margin: 0 0 20px;
  padding: 10px 14px;
  border-left: 3px solid var(--warning);
  background: var(--code-bg);
  color: var(--ink-soft);
  font-size: 0.9375rem;
}

/* ------------------------------------------------------------------ 開始画面（トンボ付きの用紙） */

.mdv-welcome {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - var(--header-h) - 140px);
  padding: 48px 40px;
}

.mdv-crop {
  position: relative;
  width: 100%;
  max-width: 660px;
  box-sizing: border-box;
  padding: 48px 52px 44px;
  transition: background-color 0.15s ease;
}

/* トンボ: 角の外側に、角に触れない 2 本の線 */
.mdv-crop-mark { position: absolute; width: 0; height: 0; color: var(--muted); transition: transform 0.18s ease, color 0.18s ease; }
.mdv-crop-mark::before,
.mdv-crop-mark::after { content: ""; position: absolute; background: currentColor; }
.mdv-crop-mark::before { width: 22px; height: 1px; }
.mdv-crop-mark::after { width: 1px; height: 22px; }
.mdv-crop-tl { left: 0; top: 0; }
.mdv-crop-tl::before { right: 9px; top: 0; }
.mdv-crop-tl::after { left: 0; bottom: 9px; }
.mdv-crop-tr { right: 0; top: 0; }
.mdv-crop-tr::before { left: 9px; top: 0; }
.mdv-crop-tr::after { right: 0; bottom: 9px; }
.mdv-crop-bl { left: 0; bottom: 0; }
.mdv-crop-bl::before { right: 9px; bottom: 0; }
.mdv-crop-bl::after { left: 0; top: 9px; }
.mdv-crop-br { right: 0; bottom: 0; }
.mdv-crop-br::before { left: 9px; bottom: 0; }
.mdv-crop-br::after { right: 0; top: 9px; }

/* ドロップ中: トンボが角に寄り、用紙に色がつく */
.mdv-app.is-dragover .mdv-crop { background: var(--accent-soft); }
.mdv-app.is-dragover .mdv-crop-mark { color: var(--accent); }
.mdv-app.is-dragover .mdv-crop-tl { transform: translate(9px, 9px); }
.mdv-app.is-dragover .mdv-crop-tr { transform: translate(-9px, 9px); }
.mdv-app.is-dragover .mdv-crop-bl { transform: translate(9px, -9px); }
.mdv-app.is-dragover .mdv-crop-br { transform: translate(-9px, -9px); }

.mdv-welcome-title {
  margin: 0 0 20px;
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 1.1rem + 2.2vw, 2.5rem);
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: 0.02em;
}
.mdv-welcome-lead { margin: 0 0 28px; max-width: 34em; color: var(--ink-soft); }
.mdv-welcome-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 16px; }
.mdv-welcome-last { margin: 0 0 16px -10px; }
.mdv-welcome-pending { margin: 0 0 16px; color: var(--muted); font-size: 0.875rem; }
.mdv-welcome-foot { margin: 28px 0 0; font-size: 0.9375rem; }
.mdv-welcome-foot a { color: var(--accent); text-underline-offset: 0.2em; }

.mdv-dropveil {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--scrim);
  pointer-events: none;
}
.mdv-dropveil-box {
  padding: 28px 44px;
  border-radius: 8px;
  background: var(--sheet);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.375rem;
  font-weight: 700;
  box-shadow: var(--overlay-shadow);
}

/* ------------------------------------------------------------------ ダイアログ・通知 */

.mdv-dialog {
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  box-sizing: border-box;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--sheet);
  color: var(--ink);
  box-shadow: var(--overlay-shadow);
}
.mdv-dialog::backdrop { background: var(--scrim); }
.mdv-dialog-wide { width: min(760px, calc(100vw - 32px)); }

.mdv-dialog-form { display: flex; flex-direction: column; max-height: calc(100vh - 50px); margin: 0; }
.mdv-dialog-head { padding: 22px 26px 0; }
.mdv-dialog-title { margin: 0 0 6px; font-family: var(--font-display); font-size: 1.375rem; font-weight: 700; line-height: 1.4; }
.mdv-dialog-lead { margin: 0; color: var(--ink-soft); font-size: 0.9375rem; }
.mdv-dialog-body { min-height: 0; overflow: auto; padding: 18px 26px 4px; }
.mdv-dialog-body:empty { padding-top: 0; }
.mdv-dialog-note { margin: 0; font-size: 0.9375rem; }
.mdv-dialog-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 26px 22px; }

.mdv-field { display: block; margin: 0 0 16px; }
.mdv-field-label { display: block; margin: 0 0 6px; font-size: 0.875rem; font-weight: 700; }
.mdv-export-css-status { margin: 0 0 8px; }
.mdv-export-css-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.mdv-export-css .mdv-dialog-note { margin: 8px 0 0; }
.mdv-input {
  width: 100%;
  height: 40px;
  box-sizing: border-box;
  padding: 0 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--sheet);
  color: var(--ink);
  font: inherit;
}
.mdv-input:focus { border-color: var(--accent); }

.mdv-export-summary { margin: 0 0 8px; color: var(--ink-soft); font-size: 0.9375rem; }
.mdv-export-warn { margin: 0 0 8px; color: var(--warning); font-size: 0.9375rem; }

.mdv-licenses {
  margin: 0;
  padding: 14px 16px;
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius);
  background: var(--code-bg);
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.mdv-toasts {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 70;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: max-content;
  max-width: calc(100vw - 32px);
  transform: translateX(-50%);
  pointer-events: none;
}
.mdv-toast {
  max-width: 100%;
  box-sizing: border-box;
  padding: 10px 18px;
  border-radius: 8px;
  background: var(--toast-bg);
  color: var(--toast-ink);
  font-size: 0.9375rem;
  line-height: 1.5;
  box-shadow: var(--overlay-shadow);
  pointer-events: auto;
}
.mdv-toast-error { box-shadow: var(--overlay-shadow), inset 4px 0 0 var(--caution); }

.mdv-hidden-input { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
/* コピー用の一時的な入力欄。画面に固定して、選択のときに画面が動かないようにする */
.mdv-copy-buffer {
  position: fixed;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  font-size: 16px;
  resize: none;
}

/* ------------------------------------------------------------------ 画面幅による切り替え */

@media (max-width: 1199px) {
  .mdv-sheet { grid-template-columns: minmax(0, var(--content-w)); }
  .mdv-toc { display: none; }
  .mdv-toc-inline { display: block; }
}

@media (max-width: 799px) {
  .mdv-body,
  .mdv-app[data-sidebar="closed"] .mdv-body { grid-template-columns: minmax(0, 1fr); }
  .mdv-sheet { padding: 0 20px 0 28px; }
  .mdv-welcome { padding: 32px 16px; }
  .mdv-crop { padding: 36px 28px 32px; }
  .mdv-title { max-width: 34vw; }
  .mdv-search-kbd { display: none; }
  .mdv-search-input { padding-right: 12px; }
  .mdv-search-panel { position: fixed; left: 12px; right: 12px; top: calc(var(--header-h) + 4px); width: auto; }

  .mdv-sidebar,
  .mdv-app[data-sidebar="closed"] .mdv-sidebar {
    display: block;
    position: fixed;
    left: 0;
    top: var(--header-h);
    bottom: 0;
    z-index: 26;
    width: min(86vw, 320px);
    height: auto;
    background: var(--desk);
    transform: translateX(-100%);
    transition: transform 0.18s ease;
    visibility: hidden;
  }
  .mdv-app.is-drawer-open .mdv-sidebar { transform: none; visibility: visible; }
  .mdv-app[data-has-set="false"] .mdv-sidebar { display: none; }
}

@media (min-width: 800px) {
  .mdv-scrim { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  .mdv-app *,
  .mdv-app *::before,
  .mdv-app *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ------------------------------------------------------------------ 印刷: 本文のみ、常にライト配色 */

@media print {
  body { background: #FFFFFF; }
  .mdv-header, .mdv-sidebar, .mdv-toc, .mdv-toc-inline, .mdv-scrim, .mdv-toasts, .mdv-dropveil,
  .mdv-skip, .mdv-copy, .mdv-anchor, .mdv-doc-meta, .mdv-dialog { display: none !important; }
  .mdv-app, .mdv-body, .mdv-sheet { display: block; min-height: 0; padding: 0; }
  .mdv-main { padding: 0; }
}

/*
 * mdfolio — 本文と配色（document.css。HTML に内蔵する見た目）
 *
 * 利用者が見た目を変えるときは、このファイルではなく、HTML の隣に置く mdfolio.css に、変えたい規則だけを書きます
 * （SPEC 3.10。例は examples/mdfolio.css）。mdfolio.css はこのファイルのあとに読み込まれるので、同じ指定なら勝ちます。
 * 以下は、変えられる変数と規則の説明です。
 *
 *   1. 配色・書体・幅 … 下の「変数」を変えると、本文と画面全体の両方に反映されます。
 *      ライト（:root）とダーク（[data-theme="dark"]）の 2 か所があります。
 *      図（Mermaid）の色も、ここの変数から取ります。
 *   2. 本文の見た目 … 「本文」以降の規則を変えます。本文は .mdv-prose の中にあり、
 *      Markdown から作られる普通の HTML（h1〜h6, p, a, ul, ol, table, pre, code, blockquote など）です。
 *   3. 印刷 … 末尾の @media print で、印刷するときの配色を決めています。
 *
 * 注意
 *   - 文字と背景の色の差（コントラスト）は 4.5:1 以上を目安にしてください。
 *   - url() で外部のアドレス（http:// や https://）を書かないでください。
 *     外部の画像を表示しない設定のときは読み込まれず、設定によっては外部に通信が発生します。
 *   - .mdv- で始まるクラス名のうち、この中に出てくるもの以外は、今後の版で変わることがあります。
 *
 * mdfolio — document body and colors (document.css; the look built into the HTML)
 *
 * To change the look, do not edit this file. Instead, write only the rules you want to change in mdfolio.css
 * next to the HTML file (see examples/mdfolio.css). mdfolio.css is loaded after this file, so it wins.
 * Below is a description of the variables and rules you can change.
 *
 *   1. Colors, fonts, widths … Changing the variables below affects both the document body and the
 *      entire interface. They are defined separately for the light theme (:root) and the dark theme
 *      ([data-theme="dark"]).
 *      Diagrams (Mermaid) take their colors from these variables too.
 *   2. Document body … Change the rules from the "Document body" section onward. The body is inside
 *      .mdv-prose and is ordinary HTML made from Markdown (h1–h6, p, a, ul, ol, table, pre, code,
 *      blockquote and so on).
 *   3. Printing … @media print at the end sets the colors used when printing.
 *
 * Notes
 *   - Aim for a contrast of at least 4.5:1 between text and background.
 *   - Do not use external URLs (http:// or https://) in url(). They are not loaded when
 *     external images are disabled, and otherwise they make the page connect to the network.
 *   - Of the class names starting with .mdv-, those not used in this file may change in future versions.
 *

/* ------------------------------------------------------------------ 変数 / Variables */

:root {
  --font-sans: "Segoe UI", "Helvetica Neue", "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
  --font-display: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", "Noto Serif JP", Georgia, serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, "BIZ UDGothic", "MS Gothic", "Noto Sans Mono CJK JP", monospace;
  --header-h: 52px;
  --side-w: 288px;
  --toc-w: 232px;
  --content-w: 50rem;
  --radius: 6px;

  /* 机（地）と紙、墨、藍 */
  --desk: #EDF1F5;
  --sheet: #FFFFFF;
  --ink: #17202B;
  --ink-soft: #3A4654;
  --muted: #5A6878;
  --rule: #D3DAE3;
  --rule-soft: #E6EAEF;
  --accent: #1D4F91;
  --accent-strong: #163D72;
  --accent-soft: #E3ECF8;
  --mark: #FFE27A;
  --mark-ink: #2B2300;
  --code-bg: #F2F5F8;
  --overlay-shadow: 0 14px 36px rgba(15, 23, 34, 0.18);
  --scrim: rgba(15, 23, 34, 0.42);
  --toast-bg: #17202B;
  --toast-ink: #FFFFFF;

  --note: #1D4F91;
  --tip: #1B7F5A;
  --important: #6B4BA8;
  --warning: #8A5A00;
  --caution: #B3261E;

  --hl-keyword: #8A2D6B;
  --hl-string: #1B6B4A;
  --hl-number: #9A4E00;
  --hl-comment: #5C6A7B;
  --hl-title: #1D4F91;
  --hl-attr: #0B6E80;
  --hl-builtin: #6B4BA8;
  --hl-add-bg: #DDF3E4;
  --hl-del-bg: #FBE3E1;

  color-scheme: light;
}

[data-theme="dark"] {
  --desk: #0F1722;
  --sheet: #151F2C;
  --ink: #DCE4EE;
  --ink-soft: #C2CCD8;
  --muted: #93A1B2;
  --rule: #2A3646;
  --rule-soft: #212C3A;
  --accent: #8AB8F2;
  --accent-strong: #A9CBF6;
  --accent-soft: #1D2D42;
  --mark: #6B5300;
  --mark-ink: #FFF3C4;
  --code-bg: #1B2736;
  --overlay-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  --scrim: rgba(0, 0, 0, 0.55);
  --toast-bg: #DCE4EE;
  --toast-ink: #151F2C;

  --note: #8AB8F2;
  --tip: #6FD3A8;
  --important: #C3A6F5;
  --warning: #F2B872;
  --caution: #F2A19B;

  --hl-keyword: #F29BCF;
  --hl-string: #8FD9A8;
  --hl-number: #F2B872;
  --hl-comment: #8D9BAC;
  --hl-title: #8AB8F2;
  --hl-attr: #7FD4E0;
  --hl-builtin: #C3A6F5;
  --hl-add-bg: #17382A;
  --hl-del-bg: #45211F;

  color-scheme: dark;
}

/* ------------------------------------------------------------------ 本文の文字

.mdv-prose {
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.8;
}

/* ------------------------------------------------------------------ 本文 / Document body */

/* 本文は自分の枠の外に描画させない（利用者の HTML がアプリの部品に重ならないように）。
   見出しの四角とフォーカス枠のぶんだけ、枠を外側に広げておく */
.mdv-prose { contain: paint; margin: -4px -6px -4px -28px; padding: 4px 6px 4px 28px; }
.mdv-prose > :first-child { margin-top: 0; }
.mdv-prose > :last-child { margin-bottom: 0; }

.mdv-prose h1,
.mdv-prose h2,
.mdv-prose h3,
.mdv-prose h4,
.mdv-prose h5,
.mdv-prose h6 {
  position: relative;
  margin: 2em 0 0.7em;
  color: var(--ink);
  font-weight: 700;
  line-height: 1.4;
}
.mdv-prose h1 { margin-top: 1.6em; font-size: 2rem; line-height: 1.3; letter-spacing: 0.01em; }
.mdv-prose h2 { margin-top: 2.2em; font-size: 1.5rem; }
.mdv-prose h3 { font-size: 1.25rem; }
.mdv-prose h4 { font-size: 1.0625rem; }
.mdv-prose h5,
.mdv-prose h6 { font-size: 1rem; color: var(--ink-soft); }

/* 「■ 見出し」: 余白にぶら下げる小さな四角 */
.mdv-prose h2::before {
  content: "";
  position: absolute;
  left: -1.05em;
  top: 0.48em;
  width: 0.46em;
  height: 0.46em;
  background: var(--accent);
}

.mdv-anchor {
  margin-left: 0.4em;
  color: var(--muted);
  font-weight: 400;
  text-decoration: none;
  opacity: 0;
}
.mdv-prose :is(h1, h2, h3, h4, h5, h6):hover .mdv-anchor,
.mdv-anchor:focus-visible { opacity: 1; }
.mdv-anchor:hover { color: var(--accent); }

.mdv-prose p,
.mdv-prose ul,
.mdv-prose ol,
.mdv-prose dl,
.mdv-prose blockquote,
.mdv-prose pre,
.mdv-prose table,
.mdv-prose figure,
.mdv-prose details { margin: 0 0 1.15em; }

.mdv-prose a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
.mdv-prose a:hover { color: var(--accent-strong); text-decoration-thickness: 2px; }
.mdv-prose a.mdv-missing { color: var(--caution); text-decoration-style: dashed; }
.mdv-prose a.mdv-ext::after { content: "\2197"; margin-left: 0.15em; font-size: 0.8em; text-decoration: none; display: inline-block; }

.mdv-prose strong { font-weight: 700; }
.mdv-prose ul,
.mdv-prose ol { padding-left: 1.6em; }
.mdv-prose li { margin: 0.25em 0; }
.mdv-prose li > ul,
.mdv-prose li > ol { margin: 0.25em 0; }
.mdv-prose li > p { margin: 0.4em 0; }

.mdv-prose .contains-task-list { padding-left: 0.2em; list-style: none; }
.mdv-prose .task-list-item { padding-left: 1.6em; text-indent: -1.6em; }
.mdv-prose .task-list-item > * { text-indent: 0; }
.mdv-prose .task-list-item input { width: 1em; height: 1em; margin: 0 0.6em 0 0; vertical-align: -0.12em; accent-color: var(--accent); }

.mdv-prose blockquote {
  padding: 2px 0 2px 16px;
  border-left: 3px solid var(--rule);
  color: var(--ink-soft);
}
.mdv-prose blockquote > :last-child { margin-bottom: 0; }

.mdv-prose hr { height: 1px; margin: 2.4em 0; border: 0; background: var(--rule); }

.mdv-prose img,
.mdv-prose video { max-width: 100%; height: auto; vertical-align: middle; }
.mdv-prose audio { max-width: 100%; }

.mdv-prose kbd {
  padding: 1px 6px;
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--sheet);
  font-family: var(--font-mono);
  font-size: 0.85em;
}

.mdv-prose details { padding: 8px 14px; border: 1px solid var(--rule); border-radius: var(--radius); }
.mdv-prose details > summary { font-weight: 700; cursor: pointer; }
.mdv-prose details[open] > summary { margin-bottom: 8px; }
.mdv-prose details > :last-child { margin-bottom: 0; }

.mdv-prose sup,
.mdv-prose sub { line-height: 0; }

.mdv-prose .footnotes-sep { margin-top: 3em; }
.mdv-prose .footnotes { color: var(--ink-soft); font-size: 0.9375rem; }
.mdv-prose .footnote-ref a { text-decoration: none; }
/* 数式のエラー表示の色は、テーマに合わせる（KaTeX は固定の色を style に書く） */
.mdv-prose .katex-error { color: var(--caution) !important; }

/* 表 */

.mdv-table-wrap { margin: 0 0 1.15em; overflow-x: auto; }
.mdv-table-wrap > table { margin: 0; }

.mdv-prose table {
  border-collapse: collapse;
  font-size: 0.9375rem;
  line-height: 1.6;
}
.mdv-prose th,
.mdv-prose td { padding: 7px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.mdv-prose th { border-bottom: 2px solid var(--ink-soft); font-weight: 700; text-align: left; white-space: nowrap; }
.mdv-prose tbody tr:last-child td { border-bottom-color: var(--ink-soft); }

/* コード */

.mdv-prose code,
.mdv-prose pre,
.mdv-plain { font-family: var(--font-mono); }

.mdv-prose :not(pre) > code {
  padding: 0.12em 0.36em;
  border-radius: 4px;
  background: var(--code-bg);
  font-size: 0.875em;
}

.mdv-code {
  margin: 0 0 1.15em;
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius);
  background: var(--code-bg);
}
.mdv-code-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 30px;
  padding: 0 4px 0 14px;
  border-bottom: 1px solid var(--rule-soft);
  color: var(--muted);
  font-size: 0.75rem;
  line-height: 1.4;
}
.mdv-copy {
  height: 24px;
  padding: 0 8px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
}
.mdv-copy:hover { background: var(--rule-soft); color: var(--ink); }

.mdv-prose pre,
.mdv-plain {
  margin: 0;
  padding: 12px 14px;
  overflow-x: auto;
  font-size: 0.875rem;
  line-height: 1.6;
  tab-size: 4;
}
.mdv-prose > pre,
.mdv-prose :not(.mdv-code) > pre {
  margin: 0 0 1.15em;
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius);
  background: var(--code-bg);
}
.mdv-plain { white-space: pre-wrap; word-break: break-all; }

.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-meta .hljs-keyword { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-char, .hljs-template-variable, .hljs-addition { color: var(--hl-string); }
.hljs-number, .hljs-symbol, .hljs-bullet, .hljs-variable.constant_ { color: var(--hl-number); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--hl-comment); }
.hljs-title, .hljs-section, .hljs-name, .hljs-selector-id, .hljs-selector-class { color: var(--hl-title); }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-variable, .hljs-params .hljs-attr { color: var(--hl-attr); }
.hljs-built_in, .hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: var(--hl-builtin); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }
.hljs-addition { background: var(--hl-add-bg); }
.hljs-deletion { background: var(--hl-del-bg); color: var(--caution); }
.hljs-link { text-decoration: underline; }

/* アラート */

.markdown-alert {
  margin: 0 0 1.15em;
  padding: 10px 16px;
  border-left: 3px solid var(--alert, var(--note));
  background: var(--code-bg);
}
.markdown-alert > :last-child { margin-bottom: 0; }
.mdv-prose .markdown-alert-title { margin: 0 0 4px; color: var(--alert, var(--note)); font-weight: 700; }
.markdown-alert-note { --alert: var(--note); }
.markdown-alert-tip { --alert: var(--tip); }
.markdown-alert-important { --alert: var(--important); }
.markdown-alert-warning { --alert: var(--warning); }
.markdown-alert-caution { --alert: var(--caution); }

/* 数式・図 */

.math-display,
.math-inline-display { display: block; margin: 1em 0; overflow-x: auto; overflow-y: hidden; text-align: center; }
.mdv-math-raw { font-family: var(--font-mono); font-size: 0.875em; color: var(--ink-soft); }
.katex { font-size: 1.1em; }

.mdv-mermaid { margin: 0 0 1.15em; overflow-x: auto; text-align: center; }
.mdv-mermaid svg { max-width: 100%; height: auto; }
.mdv-mermaid-error {
  margin: 0 0 1.15em;
  border: 1px solid var(--rule);
  border-left: 3px solid var(--caution);
  border-radius: var(--radius);
}
.mdv-mermaid-error-title { margin: 0; padding: 8px 14px 0; color: var(--caution); font-weight: 700; }
.mdv-mermaid-error-msg { margin: 0; padding: 0 14px 8px; color: var(--ink-soft); font-size: 0.875rem; white-space: pre-wrap; }
.mdv-prose .mdv-mermaid-error > pre { margin: 0; border: 0; border-top: 1px solid var(--rule-soft); border-radius: 0; }

/* プレースホルダ（見つからない画像・ブロックした外部画像） */

.mdv-ph {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  box-sizing: border-box;
  padding: 6px 12px;
  border: 1px dashed var(--muted);
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 0.875rem;
  line-height: 1.5;
  vertical-align: middle;
}
.mdv-ph .mdv-icon { width: 18px; height: 18px; }
.mdv-ph-text { min-width: 0; overflow-wrap: anywhere; }

/* 見つからない文書・添付 */

.mdv-empty { padding: 32px 0; }
.mdv-empty-title { margin: 0 0 12px; font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; line-height: 1.4; }
.mdv-empty-body { margin: 0 0 24px; color: var(--ink-soft); }
.mdv-empty code { padding: 0.12em 0.36em; border-radius: 4px; background: var(--code-bg); font-family: var(--font-mono); font-size: 0.875em; }

/* ------------------------------------------------------------------ 印刷: 常にライト配色 / Print: always light colors */

/* セレクターを二重にして詳細度を上げ、このファイルの後ろに足した配色の指定より優先させる */
@media print {
  :root:root,
  [data-theme][data-theme] {
    --desk: #FFFFFF; --sheet: #FFFFFF; --ink: #000000; --ink-soft: #222222; --muted: #555555;
    --rule: #BBBBBB; --rule-soft: #DDDDDD; --accent: #1D4F91; --accent-strong: #163D72; --accent-soft: #FFFFFF;
    --mark: #FFE27A; --mark-ink: #000000; --code-bg: #F5F5F5;
    --note: #1D4F91; --tip: #1B7F5A; --important: #6B4BA8; --warning: #8A5A00; --caution: #B3261E;
    --hl-keyword: #8A2D6B; --hl-string: #1B6B4A; --hl-number: #9A4E00; --hl-comment: #5C6A7B;
    --hl-title: #1D4F91; --hl-attr: #0B6E80; --hl-builtin: #6B4BA8; --hl-add-bg: #DDF3E4; --hl-del-bg: #FBE3E1;
    color-scheme: light;
  }
  .mdv-prose { contain: none; margin: 0; padding: 0; }
  .mdv-prose pre, .mdv-plain { white-space: pre-wrap; word-break: break-all; overflow: visible; }
  .mdv-table-wrap, .math-display, .mdv-mermaid { overflow: visible; }
  .mdv-prose h1, .mdv-prose h2, .mdv-prose h3, .mdv-prose h4 { break-after: avoid; }
  .mdv-code, .mdv-prose pre, .mdv-prose table, .mdv-prose img, .mdv-mermaid, .markdown-alert { break-inside: avoid; }
